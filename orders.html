<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABI • Porositë</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070707;
  --card:#101010;
  --card2:#151515;
  --line:#242424;
  --text:#fff;
  --muted:#8e8e8e;
  --green:#00ff88;
  --yellow:#ffc400;
  --blue:#3da5ff;
  --red:#ff4545;
}

body{
  background:
    radial-gradient(circle at top right, rgba(0,255,136,.08), transparent 30%),
    radial-gradient(circle at bottom left, rgba(61,165,255,.05), transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

/* TOP */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,7,7,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  padding:15px 20px;
}

.top-inner{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:40px;
  height:40px;
  border:1px solid var(--green);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-weight:900;
  box-shadow:0 0 18px rgba(0,255,136,.15);
}

.logo-text{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.logo-text span{
  color:var(--green);
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  border:none;
  cursor:pointer;
  font-family:inherit;
}

.btn{
  background:#171717;
  color:#fff;
  border:1px solid #292929;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  border-color:#444;
  transform:translateY(-1px);
}

.btn.green{
  background:rgba(0,255,136,.1);
  border-color:rgba(0,255,136,.4);
  color:var(--green);
}

.btn.red{
  color:#ff6464;
  border-color:rgba(255,69,69,.3);
}

/* MAIN */
.container{
  max-width:1400px;
  margin:auto;
  padding:25px 20px 60px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:22px;
}

.header h1{
  font-size:32px;
  margin-bottom:6px;
}

.header p{
  color:var(--muted);
}

.last-update{
  color:#777;
  font-size:12px;
  text-align:right;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:linear-gradient(145deg,#121212,#0d0d0d);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  position:relative;
  overflow:hidden;
}

.stat:after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  right:-30px;
  top:-30px;
  border-radius:50%;
  background:rgba(0,255,136,.08);
}

.stat-title{
  color:#888;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}

.stat-number{
  font-size:27px;
  font-weight:900;
}

.stat.pending .stat-number{
  color:var(--yellow);
}

.stat.shipped .stat-number{
  color:var(--blue);
}

.stat.delivered .stat-number{
  color:var(--green);
}

.stat.revenue .stat-number{
  color:#fff;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:240px;
  background:#101010;
  border:1px solid var(--line);
  color:#fff;
  padding:13px 15px;
  border-radius:11px;
  outline:none;
}

.search:focus{
  border-color:rgba(0,255,136,.5);
}

.filter{
  background:#101010;
  border:1px solid var(--line);
  color:#fff;
  border-radius:11px;
  padding:13px;
  outline:none;
}

/* ORDERS */
.orders{
  display:grid;
  gap:14px;
}

.order{
  background:linear-gradient(145deg,#111,#0c0c0c);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  transition:.2s;
}

.order.new{
  border-color:rgba(0,255,136,.65);
  box-shadow:0 0 25px rgba(0,255,136,.08);
}

.order-head{
  padding:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.015);
}

.order-code{
  font-weight:900;
  font-size:17px;
}

.order-code small{
  display:block;
  color:#777;
  font-size:11px;
  font-weight:normal;
  margin-top:4px;
}

.new-badge{
  display:inline-block;
  margin-left:7px;
  background:rgba(0,255,136,.12);
  border:1px solid rgba(0,255,136,.4);
  color:var(--green);
  padding:4px 7px;
  border-radius:6px;
  font-size:10px;
  font-weight:900;
}

.customer{
  padding:17px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  border-bottom:1px solid var(--line);
}

.info{
  background:#0b0b0b;
  border:1px solid #1c1c1c;
  border-radius:10px;
  padding:12px;
}

.info-label{
  color:#707070;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.info-value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.info-value a{
  color:#fff;
  text-decoration:none;
}

.info-value a:hover{
  color:var(--green);
}

.items{
  padding:0 17px;
}

.item{
  display:grid;
  grid-template-columns:65px 1fr auto auto auto;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #1c1c1c;
}

.item:last-child{
  border-bottom:none;
}

.product-img{
  width:65px;
  height:65px;
  border-radius:10px;
  object-fit:cover;
  background:#181818;
  border:1px solid #252525;
}

.product-name{
  font-weight:800;
  margin-bottom:5px;
}

.product-id{
  color:#666;
  font-size:11px;
}

.qty{
  color:#aaa;
  font-size:13px;
}

.price{
  font-weight:900;
  white-space:nowrap;
}

.status-select{
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:9px;
  border-radius:8px;
  outline:none;
  font-size:12px;
}

.status-select.pending{
  color:var(--yellow);
  border-color:rgba(255,196,0,.35);
}

.status-select.confirmed{
  color:#fff;
  border-color:#444;
}

.status-select.shipped{
  color:var(--blue);
  border-color:rgba(61,165,255,.35);
}

.status-select.delivered{
  color:var(--green);
  border-color:rgba(0,255,136,.35);
}

.status-select.cancelled{
  color:var(--red);
  border-color:rgba(255,69,69,.35);
}

.order-foot{
  padding:14px 17px;
  background:#0a0a0a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.total{
  font-size:20px;
  font-weight:900;
}

.payment{
  color:#777;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:70px 20px;
  border:1px dashed #292929;
  border-radius:17px;
  color:#777;
}

.empty-icon{
  font-size:45px;
  margin-bottom:12px;
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:100;
  background:#111;
  border:1px solid #333;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
  border-radius:13px;
  padding:15px 18px;
  min-width:260px;
  transform:translateY(120px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  border-color:rgba(0,255,136,.5);
}

.toast.error{
  border-color:rgba(255,69,69,.5);
}

.toast-title{
  font-weight:900;
  margin-bottom:4px;
}

.toast-text{
  color:#aaa;
  font-size:13px;
}

/* LOGIN */
.login-required{
  max-width:500px;
  margin:100px auto;
  text-align:center;
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:35px 25px;
}

.login-required h2{
  margin-bottom:10px;
}

.login-required p{
  color:#888;
  margin-bottom:20px;
}

/* MOBILE */
@media(max-width:1000px){
  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .customer{
    grid-template-columns:repeat(2,1fr);
  }

  .item{
    grid-template-columns:55px 1fr auto;
  }

  .item .qty{
    display:none;
  }

  .item .price{
    grid-column:2;
  }

  .item .status-select{
    grid-column:3;
    grid-row:1 / span 2;
  }

  .product-img{
    width:55px;
    height:55px;
  }
}

@media(max-width:650px){
  .top{
    padding:12px;
  }

  .container{
    padding:20px 12px 50px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .header h1{
    font-size:26px;
  }

  .last-update{
    text-align:left;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .stat:last-child{
    grid-column:span 2;
  }

  .customer{
    grid-template-columns:1fr;
  }

  .order-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .order-foot{
    align-items:flex-start;
    flex-direction:column;
  }

  .item{
    grid-template-columns:55px 1fr;
  }

  .item .status-select{
    grid-column:2;
    grid-row:auto;
    width:100%;
  }

  .item .price{
    grid-column:2;
  }

  .top-actions .btn:not(.green){
    display:none;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="top">
    <div class="top-inner">

      <div class="logo">
        <div class="logo-icon">S</div>
        <div class="logo-text">SABI <span>ORDERS</span></div>
      </div>

      <div class="top-actions">
        <button class="btn green" onclick="loadOrders(true)">
          ↻ Rifresko
        </button>

        <button class="btn" onclick="enableNotifications()">
          🔔 Njoftimet
        </button>

        <button class="btn red" onclick="logout()">
          Dil
        </button>
      </div>

    </div>
  </div>

  <main class="container">

    <div class="header">

      <div>
        <h1>Porositë</h1>
        <p>Menaxho porositë e klientëve në kohë reale.</p>
      </div>

      <div class="last-update">
        Përditësimi i fundit<br>
        <strong id="lastUpdate">—</strong>
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">Porosi totale</div>
        <div class="stat-number" id="totalOrders">0</div>
      </div>

      <div class="stat pending">
        <div class="stat-title">Në pritje</div>
        <div class="stat-number" id="pendingOrders">0</div>
      </div>

      <div class="stat shipped">
        <div class="stat-title">Të nisura</div>
        <div class="stat-number" id="shippedOrders">0</div>
      </div>

      <div class="stat delivered">
        <div class="stat-title">Të dorëzuara</div>
        <div class="stat-number" id="deliveredOrders">0</div>
      </div>

      <div class="stat revenue">
        <div class="stat-title">Vlera totale</div>
        <div class="stat-number" id="totalRevenue">0 €</div>
      </div>

    </div>

    <div class="controls">

      <input
        id="search"
        class="search"
        type="text"
        placeholder="Kërko sipas klientit, telefonit, porosisë, produktit..."
        oninput="renderOrders()"
      >

      <select id="filter" class="filter" onchange="renderOrders()">
        <option value="all">Të gjitha</option>
        <option value="pending">Në pritje</option>
        <option value="confirmed">Konfirmuara</option>
        <option value="shipped">Të nisura</option>
        <option value="delivered">Të dorëzuara</option>
        <option value="cancelled">Të anulluara</option>
      </select>

    </div>

    <div id="orders" class="orders"></div>

  </main>

</div>

<div id="toast" class="toast">
  <div id="toastTitle" class="toast-title"></div>
  <div id="toastText" class="toast-text"></div>
</div>

<script>

/*
==================================================
 SABI ORDERS
==================================================

 Nëse orders.html është brenda të njëjtit Worker:
    API_BASE = ""

 Nëse frontend-i është në një domain tjetër:
    vendos URL-në e Worker-it, p.sh.
    https://sabi-marketplace-worker.xxx.workers.dev

==================================================
*/

const API_BASE = "";


/*
==================================================
 TOKEN
==================================================
*/

function getToken(){

  const possibleKeys = [
    "sabi_token",
    "token",
    "authToken",
    "access_token",
    "sabiToken",
    "marketplace_token"
  ];

  for(const key of possibleKeys){

    const value = localStorage.getItem(key);

    if(value && /^[a-f0-9]{64}$/i.test(value)){
      return value;
    }

    if(value){

      try{

        const parsed = JSON.parse(value);

        if(parsed && typeof parsed === "object"){

          const possibleToken =
            parsed.token ||
            parsed.access_token ||
            parsed.accessToken;

          if(
            possibleToken &&
            /^[a-f0-9]{64}$/i.test(possibleToken)
          ){
            return possibleToken;
          }

        }

      }catch(e){}

    }

  }


  /*
   Nëse login-i ka përdorur një emër tjetër,
   kërkojmë automatikisht në localStorage
   për token-in 64-karakterësh të Worker-it.
  */

  for(let i=0; i<localStorage.length; i++){

    const key = localStorage.key(i);
    const value = localStorage.getItem(key);

    if(value && /^[a-f0-9]{64}$/i.test(value)){
      return value;
    }

    if(value){

      try{

        const parsed = JSON.parse(value);

        if(parsed && typeof parsed === "object"){

          const possibleToken =
            parsed.token ||
            parsed.access_token ||
            parsed.accessToken;

          if(
            possibleToken &&
            /^[a-f0-9]{64}$/i.test(possibleToken)
          ){
            return possibleToken;
          }

        }

      }catch(e){}

    }

  }

  return null;
}


/*
==================================================
 API
==================================================
*/

async function api(path, options = {}){

  const token = getToken();

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(token){
    headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(API_BASE + path,{
    ...options,
    headers
  });

  let data = null;

  try{
    data = await response.json();
  }catch(e){
    data = {};
  }

  if(!response.ok){

    const message =
      data?.error ||
      data?.message ||
      "Ndodhi një gabim.";

    const error = new Error(message);
    error.status = response.status;

    throw error;
  }

  return data;
}


/*
==================================================
 STATE
==================================================
*/

let ordersData = [];
let firstLoad = true;
let previousOrderCodes = new Set();
let notificationEnabled = false;


/*
==================================================
 STATUS
==================================================
*/

const STATUS_LABELS = {

  pending:"Në pritje",

  confirmed:"Konfirmuar",

  shipped:"Nisur",

  delivered:"Dorëzuar",

  cancelled:"Anulluar"

};


/*
==================================================
 TOAST
==================================================
*/

let toastTimer;

function showToast(title,text,type="success"){

  const toast = document.getElementById("toast");

  document.getElementById("toastTitle").textContent = title;
  document.getElementById("toastText").textContent = text;

  toast.className = "toast show " + type;

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    toast.className = "toast";
  },4500);
}


/*
==================================================
 DATE
==================================================
*/

function formatDate(date){

  if(!date) return "—";

  const d = new Date(date);

  if(isNaN(d.getTime())) return date;

  return d.toLocaleString("sq-AL",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


/*
==================================================
 MONEY
==================================================
*/

function money(value){

  const n = Number(value || 0);

  return n.toLocaleString("sq-AL",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }) + " €";
}


/*
==================================================
 ESCAPE HTML
==================================================
*/

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/*
==================================================
 GROUP ORDERS
==================================================
*/

function getGroups(){

  const groups = {};

  for(const order of ordersData){

    const code =
      order.order_code ||
      ("ORDER-" + order.id);

    if(!groups[code]){
      groups[code] = [];
    }

    groups[code].push(order);
  }

  return Object.entries(groups)
    .map(([code,items])=>({
      code,
      items,
      created_at:
        items
          .map(x=>x.created_at)
          .sort()
          .reverse()[0]
    }))
    .sort((a,b)=>{
      return new Date(b.created_at) -
             new Date(a.created_at);
    });
}


/*
==================================================
 LOAD ORDERS
==================================================
*/

async function loadOrders(manual=false){

  try{

    const token = getToken();

    if(!token){

      showLogin();

      return;
    }

    const data = await api("/api/orders");

    /*
      Worker-i kthen direkt array.
      Kjo mbështet edhe format:
      {orders:[...]}
    */

    if(Array.isArray(data)){
      ordersData = data;
    }else if(Array.isArray(data.orders)){
      ordersData = data.orders;
    }else{
      ordersData = [];
    }


    /*
    -----------------------------------------------
    POROSI TË REJA
    -----------------------------------------------
    */

    const currentCodes = new Set(
      ordersData.map(o =>
        o.order_code ||
        ("ORDER-" + o.id)
      )
    );


    if(!firstLoad){

      const newCodes = [...currentCodes]
        .filter(code => !previousOrderCodes.has(code));

      if(newCodes.length){

        const newOrder =
          ordersData.find(o =>
            (o.order_code || ("ORDER-" + o.id))
            === newCodes[0]
          );

        showToast(
          "🛎️ POROSI E RE!",
          newOrder
            ? `${newOrder.customer_name || "Klient"} ka bërë një porosi.`
            : "U krijua një porosi e re."
        );

        beep();

        if(notificationEnabled){
          sendNotification(newOrder);
        }

      }

    }

    previousOrderCodes = currentCodes;
    firstLoad = false;

    updateStats();
    renderOrders();

    document.getElementById("lastUpdate").textContent =
      new Date().toLocaleTimeString("sq-AL",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      });

    if(manual){
      showToast(
        "U përditësua",
        "Porositë u rifreskuan."
      );
    }

  }catch(error){

    console.error(error);

    if(error.status === 401){

      showToast(
        "Sesioni ka skaduar",
        "Hyr përsëri në llogari.",
        "error"
      );

      setTimeout(()=>{
        window.location.href = "login.html";
      },1200);

      return;
    }

    showToast(
      "Gabim",
      error.message || "Nuk u lexuan porositë.",
      "error"
    );

  }

}


/*
==================================================
 STATS
==================================================
*/

function updateStats(){

  const groups = getGroups();

  document.getElementById("totalOrders").textContent =
    groups.length;


  let pending = 0;
  let shipped = 0;
  let delivered = 0;
  let revenue = 0;

  for(const order of ordersData){

    const status = order.status;

    if(status === "pending"){
      pending++;
    }

    if(status === "shipped"){
      shipped++;
    }

    if(status === "delivered"){
      delivered++;
    }

    if(status !== "cancelled"){
      revenue += Number(order.total_price || 0);
    }

  }


  document.getElementById("pendingOrders").textContent =
    pending;

  document.getElementById("shippedOrders").textContent =
    shipped;

  document.getElementById("deliveredOrders").textContent =
    delivered;

  document.getElementById("totalRevenue").textContent =
    money(revenue);
}


/*
==================================================
 RENDER
==================================================
*/

function renderOrders(){

  const container =
    document.getElementById("orders");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filter =
    document.getElementById("filter")
      .value;


  let groups = getGroups();


  groups = groups.filter(group => {

    const text =
      group.code + " " +
      group.items.map(item =>
        [
          item.customer_name,
          item.customer_phone,
          item.customer_city,
          item.customer_address,
          item.product_name,
          item.buyer_email
        ].join(" ")
      ).join(" ")
      .toLowerCase();


    if(search && !text.includes(search)){
      return false;
    }


    if(filter !== "all"){

      const hasStatus =
        group.items.some(
          item => item.status === filter
        );

      if(!hasStatus){
        return false;
      }

    }

    return true;

  });


  if(!groups.length){

    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <h3>Nuk ka porosi</h3>
        <p>
          Kur një klient të bëjë një porosi,
          ajo do të shfaqet këtu.
        </p>
      </div>
    `;

    return;
  }


  container.innerHTML =
    groups.map(renderGroup).join("");

}


/*
==================================================
 RENDER GROUP
==================================================
*/

function renderGroup(group){

  const first = group.items[0];

  const code = escapeHtml(group.code);

  const customerName =
    escapeHtml(first.customer_name || "—");

  const phone =
    escapeHtml(first.customer_phone || "—");

    escapeHtml(first.customer_city || "—");

    escapeHtml(first.customer_address || "—");

    escapeHtml(first.payment_method || "cash_on_delivery");


  const total =
    group.items.reduce(

        sum + Number(item.total_price || 0),
      0
    );


  const hasPending =
    group.items.some(
      item => item.status === "pending"
    );


  const isNew =
    !previousOrderCodes.has(group.code) &&
    false;

    group.items.map(renderItem).join("");


  return `

    <article class="order ${hasPending ? "new" : ""}">

            ${formatDate(group.created_at)}

        </div>

        <div>
          <strong>
            ${group.items.length}
            ${group.items.length === 1 ? "produkt" : "produkte"}
          </strong>
        </div>

      </div>


      <div class="customer">

        <div class="info">
          <div class="info-label">Klienti</div>
          <div class="info-value">
            ${customerName}
          </div>
        </div>


        <div class="info">
          <div class="info-label">Telefon</div>
          <div class="info-value">

            ${
              first.customer_phone
              ? `<a href="tel:${escapeHtml(first.customer_phone)}">
                  ${phone}
                 </a>`
              : "—"
            }

          </div>
        </div>


        <div class="info">
          <div class="info-label">Qyteti</div>
          <div class="info-value">
            ${city}
          </div>
        </div>


        <div class="info">
          <div class="info-label">Adresa</div>

            ${address}

      </div>


      <div class="items">

        ${itemsHtml}

        <div>
          <div class="payment">

/*
==================================================
 RENDER ITEM
==================================================
*/

function renderItem(item){

  const image =
    item.product_image ||
    "https://placehold.co/150x150/151515/ffffff?text=SABI";


  const status =
    item.status || "pending";


  return `

      <div>

        <div class="product-name">

        </div>

        <div class="product-id">
          Produkt #${escapeHtml(item.product_id)}
        </div>

      </div>


      <div class="qty">
        x${Number(item.quantity || 0)}
      </div>


      <div class="price">
        ${money(item.total_price)}

      <select

        </option>

          Nisur
        </option>

        <option value="delivered"
          ${status === "delivered" ? "selected" : ""}>

        </option>

          Anulluar
        </option>

      </select>

    </div>

  `;
}


/*
==================================================
 CHANGE STATUS
==================================================
*/

async function changeStatus(orderId,select){

  const newStatus = select.value;

  select.disabled = true;

  try{

    await api("/api/orders/" + orderId,{

      method:"PUT",

      body:JSON.stringify({
        status:newStatus
      })

    });


    /*
      Përditësojmë edhe state-in lokal
      që faqja të mos ketë nevojë
      të presë refresh-in.
    */

    const item =
      ordersData.find(
        x => Number(x.id) === Number(orderId)
      );

    if(item){
      item.status = newStatus;
    }


    updateStats();

    renderOrders();


    showToast(
      "Statusi u ndryshua",
      "Porosia tani është: " +
      STATUS_LABELS[newStatus]
    );


  }catch(error){

    showToast(
      "Gabim",
      error.message || "Nuk u ndryshua statusi.",
      "error"
    );

    await loadOrders(false);

  }finally{

    select.disabled = false;

  }

}

async function enableNotifications(){

  if(!("Notification" in window)){

    showToast(
      "Nuk mbështetet",
      "Ky browser nuk mbështet njoftime.",
      "error"
    );

    return;
  }


  const permission =
    await Notification.requestPermission();


  if(permission === "granted"){

    notificationEnabled = true;

    showToast(
      "🔔 Njoftimet aktive",
      "Do të njoftohesh për porositë e reja."
    );

    new Notification("SABI Orders",{
      body:"Njoftimet për porositë janë aktive."
    });

  }else{

    showToast(
      "Njoftimet u bllokuan",
      "Lejoji nga cilësimet e browser-it.",
      "error"
    );

  }

}


function sendNotification(order){

  if(!("Notification" in window)){
    return;
  }

  if(Notification.permission !== "granted"){
    return;
  }

  new Notification("🛎️ Porosi e re — SABI",{

    body:
      `${order?.customer_name || "Klient"} • ` +
      `${money(order?.total_price || 0)}`

  });

}


/*
==================================================
 SOUND
==================================================
*/

function beep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx = new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.frequency.value = 880;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(
      0.001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.12,
      ctx.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.5
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.5
    );

  }catch(e){}

}

<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABI • Paneli i Shitësit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:#fff;
  min-height:100vh;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  height:72px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,5,.95);
  backdrop-filter:blur(15px);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{color:#777}

.header-right{
  display:flex;
  gap:9px;
}

.btn{
  background:#111;
  color:#fff;
  border:1px solid #292929;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
}

.btn:hover{background:#1d1d1d}

.btn.white{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.btn.red{color:#ff7777}

.container{
  max-width:1250px;
  margin:auto;
  padding:30px 20px 70px;
}

.title{margin-bottom:25px}

.title h1{
  font-size:34px;
  margin-bottom:7px;
}

.title p{color:#777}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:30px;
}

.stat{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:16px;
  padding:21px;
}

.stat small{
  color:#777;
  font-size:11px;
}

.stat h2{
  font-size:29px;
  margin-top:10px;
}

.shop-box{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.shop-info small{color:#777}

.shop-info h2{margin-top:7px}

.shop-phone{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.nav{
  display:flex;
  gap:8px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.nav button{
  background:#101010;
  color:#888;
  border:1px solid #252525;
  padding:11px 16px;
  border-radius:10px;
}

.nav button.active{
  color:#fff;
  border-color:#fff;
}

.section{display:none}
.section.active{display:block}

.card{
  background:#0b0b0b;
  border:1px solid #202020;
  border-radius:16px;
  overflow:hidden;
}

.card-head{
  padding:20px;
  border-bottom:1px solid #202020;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.card-head h2{font-size:20px}

.search{
  width:230px;
  background:#111;
  color:#fff;
  border:1px solid #292929;
  padding:11px;
  border-radius:9px;
  outline:none;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:20px;
}

.product{
  background:#0f0f0f;
  border:1px solid #222;
  border-radius:14px;
  overflow:hidden;
}

.product-image{
  height:190px;
  background:#151515;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-info{padding:14px}

.category{
  color:#666;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.product-name{
  font-weight:800;
  margin-bottom:7px;
}

.price{
  font-size:18px;
  font-weight:900;
  margin-bottom:7px;
}

.stock-text{
  color:#777;
  font-size:12px;
  margin-bottom:13px;
}

.product-actions{
  display:flex;
  gap:7px;
}

.action{
  flex:1;
  padding:9px;
  border-radius:8px;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
}

.action.delete{color:#ff7777}

.table-wrap{overflow-x:auto}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:15px;
  border-bottom:1px solid #1c1c1c;
  text-align:left;
  white-space:nowrap;
}

th{
  color:#666;
  font-size:11px;
  text-transform:uppercase;
}

td{font-size:14px}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.green{
  background:#0d2a19;
  color:#6dff9f;
}

.badge.orange{
  background:#2b210d;
  color:#ffc55b;
}

.badge.red{
  background:#2c1010;
  color:#ff7777;
}

.order-products{
  color:#aaa;
  white-space:normal;
  min-width:180px;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#666;
  grid-column:1/-1;
}

.loading{
  text-align:center;
  padding:50px;
  color:#00ff88;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#0c0c0c;
  border:1px solid #292929;
  border-radius:18px;
  padding:24px;
}

.modal-box h2{margin-bottom:18px}

.form-group{margin-bottom:14px}

.form-group label{
  display:block;
  color:#888;
  font-size:12px;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:9px;
  padding:12px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modal-actions button{flex:1}

@media(max-width:1000px){
  .products{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px){
  header{padding:0 14px}

  .container{
    padding:25px 12px 50px;
  }

  .title h1{font-size:28px}

  .shop-box{
    align-items:flex-start;
    flex-direction:column;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    padding:12px;
  }

  .product-image{height:160px}
  .product-info{padding:11px}
  .product-name{font-size:14px}
  .price{font-size:15px}

  .action{
    font-size:11px;
    padding:8px 5px;
  }

  .card-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .search{width:100%}
}

@media(max-width:400px){
  .stats{gap:8px}
  .stat{padding:15px}
  .stat h2{font-size:23px}
}
</style>
</head>

<body>

<header>

  <div class="logo">
    SABI<span>•</span>
  </div>

  <div class="header-right">

    <button class="btn" onclick="goMarketplace()">
      Marketplace
    </button>

    <button class="btn red" onclick="logout()">
      Dil
    </button>

  </div>

</header>

<div class="container">

  <div class="title">
    <h1>PANELI I SHITËSIT</h1>
    <p>Menaxho produktet dhe porositë e dyqanit tënd.</p>
  </div>

  <div class="stats">

    <div class="stat">
      <small>PRODUKTET E MIA</small>
      <h2 id="productCount">0</h2>
    </div>

    <div class="stat">
      <small>POROSI</small>
      <h2 id="orderCount">0</h2>
    </div>

    <div class="stat">
      <small>SHITJE</small>
      <h2 id="salesTotal">0€</h2>
    </div>

    <div class="stat">
      <small>STATUSI</small>
      <h2 style="font-size:18px;color:#6dff9f;">
        AKTIV
      </h2>
    </div>

  </div>

  <div class="shop-box">

    <div class="shop-info">

      <small>DYQANI</small>

      <h2 id="shopName">
        Shitës SABI
      </h2>

      <div class="shop-phone" id="shopPhone">
        -
      </div>

    </div>

    <button class="btn white" onclick="openProductModal()">
      + Shto produkt
    </button>

  </div>

  <div class="nav">

    <button class="active" onclick="showSection('products',this)">
      Produktet
    </button>

    <button onclick="showSection('orders',this)">
      Porositë
    </button>

  </div>

  <section class="section active" id="productsSection">

    <div class="card">

      <div class="card-head">

        <h2>Produktet e mia</h2>

        <input
          id="productSearch"
          class="search"
          placeholder="Kërko produkt..."
          oninput="renderProducts()"
        >

      </div>

      <div class="products" id="productsList">

        <div class="loading">
          Po ngarkohen...
        </div>

      </div>

    </div>

  </section>

  <section class="section" id="ordersSection">

    <div class="card">

      <div class="card-head">
        <h2>Porositë e mia</h2>
      </div>

      <div class="table-wrap" id="ordersList">
        <div class="empty">
          Po ngarkohen porositë...
        </div>
      </div>

    </div>

  </section>

</div>

<div class="modal" id="productModal">

  <div class="modal-box">

    <h2 id="modalTitle">Shto produkt</h2>

    <input type="hidden" id="editId">

    <div class="form-group">
      <label>Emri i produktit</label>
      <input id="productName" placeholder="p.sh. Nike Air Max">
    </div>

    <div class="form-group">
      <label>Çmimi (€)</label>
      <input id="productPrice" type="number" min="0" step="0.01" placeholder="50">
    </div>

    <div class="form-group">

      <label>Kategoria</label>

      <select id="productCategory">
        <option value="Fashion">Fashion</option>
        <option value="Elektronikë">Elektronikë</option>
        <option value="Këpucë">Këpucë</option>
        <option value="Aksesorë">Aksesorë</option>
        <option value="Të tjera">Të tjera</option>
      </select>

    </div>

    <div class="form-group">
      <label>Foto URL</label>
      <input id="productImage" placeholder="https://...">
    </div>

    <div class="form-group">
      <label>Përshkrimi</label>
      <textarea id="productDescription" placeholder="Përshkrimi..."></textarea>
    </div>

    <div class="form-group">
      <label>Sasia / Stoku</label>
      <input id="productStock" type="number" min="0" value="1">
    </div>

    <div class="modal-actions">

      <button class="btn" onclick="closeProductModal()">
        Anulo
      </button>

      <button class="btn white" onclick="saveProduct()">
        Ruaj produktin
      </button>

    </div>

  </div>

</div>

<script>

const API =
  location.hostname.includes("github.io")
    ? "https://sabi-marketplace.babasabfreefire2.workers.dev/api"
    : "/api";

let products = [];
let orders = [];

let sellerId =
  localStorage.getItem("sabiUserId") || "";

let sellerContact =
  localStorage.getItem("sabiUserContact") || "";

let sellerName = "";
let sellerPhone = "";

let currentShop =
  localStorage.getItem("sabiShop") || "";


/* ================================
   ESCAPE
================================ */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ================================
   CATEGORY
================================ */

function toDbCategory(category){

  if(category === "Elektronikë") return "Electronics";
  if(category === "Aksesorë") return "Accessories";
  if(category === "Këpucë") return "Shoes";
  if(category === "Të tjera") return "Home";

  return "Fashion";
}

function fromDbCategory(category){

  if(category === "Electronics") return "Elektronikë";
  if(category === "Accessories") return "Aksesorë";
  if(category === "Shoes") return "Këpucë";
  if(category === "Home") return "Të tjera";

  return "Fashion";
}


/* ================================
   PREPARE SELLER
================================ */

async function prepareSeller(){

  /*
    PRODUKTET EKZISTUESE NË D1
    janë me seller_id = 1.

    Nëse përdoruesi është admin,
    e lidhim direkt me seller ID 1.
  */

  const role =
    localStorage.getItem("sabiUserRole") || "";

  const contact =
    localStorage.getItem("sabiUserContact") || "";


  if(
    role === "admin" ||
    contact.toLowerCase() === "admin" ||
    contact.toLowerCase() === "admin@sabi.com"
  ){

    sellerId = "1";

    localStorage.setItem(
      "sabiUserId",
      "1"
    );

    sellerName = "Admin";
    currentShop = "Shitës SABI";

    localStorage.setItem(
      "sabiShop",
      currentShop
    );

    return true;
  }


  /*
    Nëse kemi ID valide,
    përdorim atë.
  */

  if(sellerId){

    return true;
  }


  /*
    Nëse kemi email,
    kërkojmë user-in në D1.
  */

  if(
    sellerContact &&
    sellerContact.includes("@")
  ){

    try{

      const response =
        await fetch(
          `${API}/users/find?email=${encodeURIComponent(sellerContact)}`
        );

      if(response.ok){

        const user =
          await response.json();

        if(user && user.id){

          sellerId =
            String(user.id);

          sellerName =
            user.name || "";

          localStorage.setItem(
            "sabiUserId",
            sellerId
          );

          return true;
        }
      }

    }catch(error){

      console.error(error);

    }
  }


  /*
    Nëse nuk ekziston user,
    krijojmë një të ri.
  */

  try{

    const name =
      localStorage.getItem("sabiSellerName") ||
      "Shitës SABI";

    const email =
      sellerContact &&
      sellerContact.includes("@")
        ? sellerContact
        : `seller_${Date.now()}@sabi.local`;

    const response =
      await fetch(`${API}/users`,{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          name:name,
          email:email
        })

      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Nuk u krijua përdoruesi."
      );
    }

    sellerId =
      String(data.id);

    sellerName =
      data.name || name;

    localStorage.setItem(
      "sabiUserId",
      sellerId
    );

    return true;

  }catch(error){

    console.error(error);

    return false;
  }
}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

  const box =
    document.getElementById("productsList");

  box.innerHTML = `
    <div class="loading">
      Po ngarkohen produktet...
    </div>
  `;

  try{

    const response =
      await fetch(`${API}/products`);

    if(!response.ok){

      throw new Error(
        "API products error: " +
        response.status
      );
    }

    const data =
      await response.json();

    products =
      Array.isArray(data)
        ? data
        : [];

    renderAll();

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        <h3>Gabim gjatë ngarkimit</h3>

        <p style="margin-top:8px;">
          ${escapeHTML(error.message)}
        </p>
      </div>
    `;
  }
}


/* ================================
   LOAD ORDERS
================================ */

async function loadOrders(){

  try{

    const response =
      await fetch(`${API}/orders`);

    if(!response.ok){

      throw new Error(
        "API orders error: " +
        response.status
      );
    }

    const data =
      await response.json();

    orders =
      Array.isArray(data)
        ? data
        : [];

    renderOrders();
    updateStats();

  }catch(error){

    console.error(error);

    document.getElementById("ordersList")
      .innerHTML = `
        <div class="empty">
          <h3>Nuk u ngarkuan porositë</h3>

          <p style="margin-top:8px;">
            ${escapeHTML(error.message)}
          </p>
        </div>
      `;
  }
}


/* ================================
   MY PRODUCTS
================================ */

function getMyProducts(){

  return products.filter(product =>
    Number(product.seller_id) ===
    Number(sellerId)
  );
}


/* ================================
   MY ORDERS
================================ */

function getMyOrders(){

  const myProductIds =
    new Set(
      getMyProducts().map(
        product => String(product.id)
      )
    );

  return orders.filter(order => {

    if(order.product_id != null){

      return myProductIds.has(
        String(order.product_id)
      );
    }

    if(order.seller_id != null){

      return Number(order.seller_id) ===
        Number(sellerId);
    }

    return false;
  });
}


/* ================================
   SHOP
================================ */

function renderShop(){

  const myProducts =
    getMyProducts();

  const first =
    myProducts[0];

  if(first){

    sellerName =
      first.sellerName ||
      first.seller ||
      sellerName ||
      "Shitës SABI";

    sellerPhone =
      first.sellerPhone ||
      sellerPhone ||
      "";

    if(!currentShop){

      currentShop =
        first.seller ||
        first.sellerName ||
        sellerName;

      localStorage.setItem(
        "sabiShop",
        currentShop
      );
    }
  }

  document.getElementById("shopName")
    .textContent =
      currentShop ||
      sellerName ||
      "Shitës SABI";

  document.getElementById("shopPhone")
    .textContent =
      sellerPhone ||
      sellerContact ||
      "-";
}


/* ================================
   STATS
================================ */

function updateStats(){

  const myProducts =
    getMyProducts();

  const myOrders =
    getMyOrders();

  document.getElementById("productCount")
    .textContent =
      myProducts.length;

  document.getElementById("orderCount")
    .textContent =
      myOrders.length;

  const sales =
    myOrders.reduce(
      (sum,order) =>
        sum +
        Number(
          order.total_price ||
          order.total ||
          0
        ),
      0
    );

  document.getElementById("salesTotal")
    .textContent =
      sales.toFixed(2) + "€";
}


/* ================================
   RENDER PRODUCTS
================================ */

function renderProducts(){

  const box =
    document.getElementById("productsList");

  const search =
    document.getElementById("productSearch")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    getMyProducts().filter(product => {

      const text = `
        ${product.name || ""}
        ${product.title || ""}
        ${product.category || ""}
        ${product.description || ""}
      `.toLowerCase();

      return text.includes(search);
    });

  if(!filtered.length){

    box.innerHTML = `
      <div class="empty">
        <h3>Nuk ke produkte.</h3>

        <p style="margin-top:8px;">
          Shto produktin e parë të dyqanit.
        </p>
      </div>
    `;

    return;
  }

  box.innerHTML =
    filtered.map(product => {

      const image =
        product.image ||
        product.image_url ||
        "https://via.placeholder.com/600x500?text=SABI";

      const name =
        product.name ||
        product.title ||
        "Produkt";

      const price =
        Number(product.price || 0);

      const stock =
        Number(product.stock ?? 0);

      return `

        <div class="product">

          <div class="product-image">

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(name)}"
              onerror="
                this.src='https://via.placeholder.com/600x500?text=SABI'
              "
            >

          </div>

          <div class="product-info">

            <div class="category">
              ${escapeHTML(
                fromDbCategory(product.category)
              )}
            </div>

            <div class="product-name">
              ${escapeHTML(name)}
            </div>

            <div class="price">
              ${price.toFixed(2)}€
            </div>

            <div class="stock-text">
              Stok: ${stock}
            </div>

            <div class="product-actions">

              <button
                class="action"
                onclick="editProduct(${Number(product.id)})"
              >
                Ndrysho
              </button>

              <button
                class="action delete"
                onclick="deleteProduct(${Number(product.id)})"
              >
                Fshi
              </button>

            </div>

          </div>

        </div>
      `;

    }).join("");
}


/* ================================
   RENDER ORDERS
================================ */

function renderOrders(){

  const box =
    document.getElementById("ordersList");

  const myOrders =
    getMyOrders();

  if(!myOrders.length){

    box.innerHTML = `
      <div class="empty">

        <h3>Nuk ka porosi ende.</h3>

        <p style="margin-top:8px;">
          Kur dikush të blejë një produkt,
          porosia do të shfaqet këtu.
        </p>

      </div>
    `;

    return;
  }

  box.innerHTML = `

    <table>

      <thead>

        <tr>
          <th>ID</th>
          <th>Data</th>
          <th>Produkti</th>
          <th>Klienti</th>
          <th>Sasia</th>
          <th>Totali</th>
          <th>Statusi</th>
        </tr>

      </thead>

      <tbody>

        ${myOrders.map(order => {

          const product =
            products.find(
              p =>
                String(p.id) ===
                String(order.product_id)
            );

          const productName =
            order.product_name ||
            order.name ||
            product?.name ||
            product?.title ||
            "Produkt";

          const customer =
            order.buyer_name ||
            order.buyer_email ||
            order.customer ||
            "Klient";

          const quantity =
            Number(
              order.quantity ||
              order.qty ||
              1
            );

          const total =
            Number(
              order.total_price ||
              order.total ||
              0
            );

          const status =
            order.status ||
            "pending";

          const date =
            order.created_at ||
            order.date ||
            "-";

          let badgeClass = "orange";

          if(
            status === "completed" ||
            status === "delivered"
          ){
            badgeClass = "green";
          }

          if(
            status === "cancelled" ||
            status === "rejected"
          ){
            badgeClass = "red";
          }

          return `

            <tr>

              <td>
                <strong>
                  #${escapeHTML(order.id)}
                </strong>
              </td>

              <td>
                ${escapeHTML(date)}
              </td>

              <td>
                <div class="order-products">
                  ${escapeHTML(productName)}
                </div>
              </td>

              <td>
                ${escapeHTML(customer)}
              </td>

              <td>
                ${quantity}
              </td>

              <td>
                <strong>
                  ${total.toFixed(2)}€
                </strong>
              </td>

              <td>
                <span class="badge ${badgeClass}">
                  ${escapeHTML(status)}
                </span>
              </td>

            </tr>

          `;

        }).join("")}

      </tbody>

    </table>
  `;
}

/* ================================
   SAVE PRODUCT
================================ */

async function saveProduct(){

  const editId =
    document.getElementById("editId").value;

  const name =
    document.getElementById("productName")
      .value.trim();

  const price =
    Number(
      document.getElementById("productPrice").value
    );

  const category =
    document.getElementById("productCategory")
      .value;

  const image =
    document.getElementById("productImage")
      .value.trim();

  const description =
    document.getElementById("productDescription")
      .value.trim();

  const stock =
    Number(
      document.getElementById("productStock").value
    );

  if(!name){
    alert("Vendos emrin e produktit.");
    return;
  }

  if(!price || price <= 0){
    alert("Vendos një çmim të vlefshëm.");
    return;
  }

  if(stock < 0){
    alert("Stoku nuk mund të jetë negativ.");
    return;
  }

  const ready =
    await prepareSeller();

  if(!ready || !sellerId){

    alert(
      "Nuk u gjet llogaria e shitësit. Hyr përsëri."
    );

    return;
  }

  try{

    const dbCategory =
      toDbCategory(category);

    let response;

    if(editId){

      response =
        await fetch(
          `${API}/products/${encodeURIComponent(editId)}`,
          {
            method:"PUT",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({
              title:name,
              description:description,
              price:price,
              image_url:image,
              category:dbCategory,
              stock:stock
            })
          }
        );

    }else{

      response =
        await fetch(
          `${API}/products`,
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({
              title:name,
              description:description,
              price:price,
              image_url:image,
              seller_id:Number(sellerId),
              category:dbCategory,
              stock:stock
            })
          }
        );
    }

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Veprimi dështoi."
      );
    }

    alert(
      editId
        ? "Produkti u ndryshua me sukses. ✅"
        : "Produkti u shtua me sukses. ✅"
    );

    closeProductModal();

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Gabim: " +
      error.message
    );
  }
}


/* ================================
   EDIT
================================ */

function editProduct(id){

  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(id)
    );

  if(!product){

    alert("Produkti nuk u gjet.");
    return;
  }

  if(
    Number(product.seller_id) !==
    Number(sellerId)
  ){

    alert(
      "Ky produkt nuk i përket llogarisë tënde."
    );

    return;
  }

  document.getElementById("modalTitle")
    .textContent =
      "Ndrysho produkt";

  document.getElementById("editId")
    .value =
      product.id;

  document.getElementById("productName")
    .value =
      product.name ||
      product.title ||
      "";

  document.getElementById("productPrice")
    .value =
      product.price ||
      "";

  document.getElementById("productCategory")
    .value =
      fromDbCategory(product.category);

  document.getElementById("productImage")
    .value =
      product.image ||
      product.image_url ||
      "";

  document.getElementById("productDescription")
    .value =
      product.description ||
      "";

  document.getElementById("productStock")
    .value =
      Number(product.stock ?? 0);

  document.getElementById("productModal")
    .classList.add("show");
}


/* ================================
   DELETE
================================ */

async function deleteProduct(id){

  const product =
    products.find(
      p =>
        Number(p.id) ===
        Number(id)
    );

  if(!product){

    alert("Produkti nuk u gjet.");
    return;
  }

  if(
    Number(product.seller_id) !==
    Number(sellerId)
  ){

    alert(
      "Ky produkt nuk i përket llogarisë tënde."
    );

    return;
  }

  const name =
    product.name ||
    product.title ||
    "Produkt";

  if(
    !confirm(
      `Do të fshish "${name}"?`
    )
  ){
    return;
  }

  try{

    const response =
      await fetch(
        `${API}/products/${encodeURIComponent(id)}`,
        {
          method:"DELETE"
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Produkti nuk u fshi."
      );
    }

    alert(
      "Produkti u fshi me sukses. ✅"
    );

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Gabim gjatë fshirjes: " +
      error.message
    );
  }
}

<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABI • Paneli i Shitësit</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:#fff;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  height:72px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,5,.95);
  backdrop-filter:blur(15px);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{
  color:#777;
}

.header-right{
  display:flex;
  gap:9px;
}

.btn{
  background:#111;
  color:#fff;
  border:1px solid #292929;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
}

.btn:hover{
  background:#1d1d1d;
}

.btn.white{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.btn.red{
  color:#ff7777;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:30px 20px 70px;
}

.title{
  margin-bottom:25px;
}

.title h1{
  font-size:34px;
  margin-bottom:7px;
}

.title p{
  color:#777;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:30px;
}

.stat{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:16px;
  padding:21px;
}

.stat small{
  color:#777;
  font-size:11px;
}

.stat h2{
  font-size:29px;
  margin-top:10px;
}

/* SHOP */

.shop-box{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:16px;
  padding:20px;
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.shop-info small{
  color:#777;
}

.shop-info h2{
  margin-top:7px;
}

.shop-phone{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

/* NAV */

.nav{
  display:flex;
  gap:8px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.nav button{
  background:#101010;
  color:#888;
  border:1px solid #252525;
  padding:11px 16px;
  border-radius:10px;
}

.nav button.active{
  color:#fff;
  border-color:#fff;
}

/* SECTIONS */

.section{
  display:none;
}

.section.active{
  display:block;
}

/* CARD */

.card{
  background:#0b0b0b;
  border:1px solid #202020;
  border-radius:16px;
  overflow:hidden;
}

.card-head{
  padding:20px;
  border-bottom:1px solid #202020;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.card-head h2{
  font-size:20px;
}

.search{
  width:230px;
  background:#111;
  color:#fff;
  border:1px solid #292929;
  padding:11px;
  border-radius:9px;
  outline:none;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:20px;
}

.product{
  background:#0f0f0f;
  border:1px solid #222;
  border-radius:14px;
  overflow:hidden;
}

.product-image{
  height:190px;
  background:#151515;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-info{
  padding:14px;
}

.category{
  color:#666;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.product-name{
  font-weight:800;
  margin-bottom:7px;
}

.price{
  font-size:18px;
  font-weight:900;
  margin-bottom:13px;
}

.product-actions{
  display:flex;
  gap:7px;
}

.action{
  flex:1;
  padding:9px;
  border-radius:8px;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
}

.action.delete{
  color:#ff7777;
}

/* ORDERS */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:15px;
  border-bottom:1px solid #1c1c1c;
  text-align:left;
  white-space:nowrap;
}

th{
  color:#666;
  font-size:11px;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.green{
  background:#0d2a19;
  color:#6dff9f;
}

.badge.orange{
  background:#2b210d;
  color:#ffc55b;
}

.badge.red{
  background:#2c1010;
  color:#ff7777;
}

.order-products{
  color:#aaa;
  white-space:normal;
  min-width:200px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#666;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#0c0c0c;
  border:1px solid #292929;
  border-radius:18px;
  padding:24px;
}

.modal-box h2{
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  color:#888;
  font-size:12px;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:9px;
  padding:12px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

/* RESPONSIVE */

@media(max-width:1000px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:700px){

  header{
    padding:0 14px;
  }

  .container{
    padding:25px 12px 50px;
  }

  .title h1{
    font-size:28px;
  }

  .shop-box{
    align-items:flex-start;
    flex-direction:column;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    padding:12px;
  }

  .product-image{
    height:160px;
  }

  .product-info{
    padding:11px;
  }

  .product-name{
    font-size:14px;
  }

  .price{
    font-size:15px;
  }

  .action{
    font-size:11px;
    padding:8px 5px;
  }

  .card-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .search{
    width:100%;
  }

}

@media(max-width:400px){

  .stats{
    gap:8px;
  }

  .stat{
    padding:15px;
  }

  .stat h2{
    font-size:23px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    SABI<span>•</span>
  </div>

  <div class="header-right">

    <button
      class="btn"
      onclick="goMarketplace()"
    >
      Marketplace
    </button>

    <button
      class="btn red"
      onclick="logout()"
    >
      Dil
    </button>

  </div>

</header>


<div class="container">

  <div class="title">

    <h1>PANELI I SHITËSIT</h1>

    <p>
      Menaxho produktet dhe porositë e dyqanit tënd.
    </p>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <small>PRODUKTET E MIA</small>

      <h2 id="productCount">
        0
      </h2>

    </div>


    <div class="stat">

      <small>POROSI</small>

      <h2 id="orderCount">
        0
      </h2>

    </div>


    <div class="stat">

      <small>SHITJE</small>

      <h2 id="salesTotal">
        0€
      </h2>

    </div>


    <div class="stat">

      <small>STATUSI</small>

      <h2
        style="
          font-size:18px;
          color:#6dff9f;
        "
      >
        AKTIV
      </h2>

    </div>

  </div>


  <!-- SHOP -->

  <div class="shop-box">

    <div class="shop-info">

      <small>DYQANI</small>

      <h2 id="shopName">
        SABI Store
      </h2>

      <div
        class="shop-phone"
        id="shopPhone"
      >
        -
      </div>

    </div>


    <button
      class="btn white"
      onclick="openProductModal()"
    >
      + Shto produkt
    </button>

  </div>


  <!-- NAV -->

  <div class="nav">

    <button
      class="active"
      onclick="showSection('products',this)"
    >
      Produktet
    </button>

    <button
      onclick="showSection('orders',this)"
    >
      Porositë
    </button>

  </div>


  <!-- PRODUCTS -->

  <section
    class="section active"
    id="productsSection"
  >

    <div class="card">

      <div class="card-head">

        <h2>Produktet e mia</h2>

        <input
          id="productSearch"
          class="search"
          placeholder="Kërko produkt..."
          oninput="renderProducts()"
        >

      </div>


      <div
        class="products"
        id="productsList"
      ></div>

    </div>

  </section>


  <!-- ORDERS -->

  <section
    class="section"
    id="ordersSection"
  >

    <div class="card">

      <div class="card-head">

        <h2>Porositë e mia</h2>

      </div>


      <div
        class="table-wrap"
        id="ordersList"
      ></div>

    </div>

  </section>

</div>


<!-- PRODUCT MODAL -->

<div
  class="modal"
  id="productModal"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      Shto produkt
    </h2>

    <input
      type="hidden"
      id="editId"
    >


    <div class="form-group">

      <label>
        Emri i produktit
      </label>

      <input
        id="productName"
        placeholder="p.sh. Nike Air Max"
      >

    </div>


    <div class="form-group">

      <label>
        Çmimi (€)
      </label>

      <input
        id="productPrice"
        type="number"
        step="0.01"
        placeholder="50"
      >

    </div>


    <div class="form-group">

      <label>
        Kategoria
      </label>

      <select id="productCategory">

        <option>Fashion</option>
        <option>Elektronikë</option>
        <option>Këpucë</option>
        <option>Aksesorë</option>
        <option>Të tjera</option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Foto URL
      </label>

      <input
        id="productImage"
        placeholder="https://..."
      >

    </div>


    <div class="form-group">

      <label>
        Përshkrimi
      </label>

      <textarea
        id="productDescription"
        placeholder="Përshkrimi..."
      ></textarea>

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        onclick="closeProductModal()"
      >
        Anulo
      </button>

      <button
        class="btn white"
        onclick="saveProduct()"
      >
        Ruaj produktin
      </button>

    </div>

  </div>

</div>


<script>

/* DATA */

let products =
  JSON.parse(
    localStorage.getItem("sabiProducts") || "[]"
  );


let orders =
  JSON.parse(
    localStorage.getItem("sabiOrders") || "[]"
  );


/* CURRENT SELLER */

let currentShop =
  localStorage.getItem("sabiShop") || "";


/*
  Nëse nuk ka të dhëna të shitësit,
  marrim shitësin e parë të produkteve.
*/

if(!currentShop){

  const firstProduct =
    products.find(
      p => p.seller || p.sellerName
    );

  if(firstProduct){

    currentShop =
      firstProduct.seller ||
      firstProduct.sellerName ||
      "";

  }

}


/* SAVE */

function saveProducts(){

  localStorage.setItem(
    "sabiProducts",
    JSON.stringify(products)
  );

}


/* ESCAPE */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* MY PRODUCTS */

function getMyProducts(){

  if(!currentShop){

    return [];

  }

  return products.filter(p => {

    const seller =
      p.seller ||
      p.sellerName ||
      "";

    return seller === currentShop;

  });

}


/* MY ORDERS */

function getMyOrders(){

  const myProducts =
    getMyProducts();

  const myProductIds =
    new Set(
      myProducts.map(p => String(p.id))
    );


  const result = [];


  orders.forEach(order => {

    const items =
      Array.isArray(order.items)
        ? order.items
        : [];


    const matchingItems =
      items.filter(item =>
        myProductIds.has(
          String(item.id)
        )
      );


    if(matchingItems.length){

      const total =
        matchingItems.reduce(
          (sum,item) =>
            sum +
            Number(item.price || 0) *
            Number(item.qty || 1),
          0
        );


      result.push({

        ...order,

        items:matchingItems,

        sellerTotal:total

      });

    }

  });


  return result;

}


/* SHOP INFO */

function renderShop(){

  const myProducts =
    getMyProducts();

  const first =
    myProducts[0];


  const shop =
    currentShop ||
    "SABI Store";


  document.getElementById("shopName")
    .textContent = shop;


  document.getElementById("shopPhone")
    .textContent =
      first?.sellerPhone || "-";

}


/* STATS */

function updateStats(){

  const myProducts =
    getMyProducts();

  const myOrders =
    getMyOrders();


  document.getElementById("productCount")
    .textContent =
      myProducts.length;


  document.getElementById("orderCount")
    .textContent =
      myOrders.length;


  const sales =
    myOrders.reduce(
      (sum,order) =>
        sum + Number(order.sellerTotal || 0),
      0
    );


  document.getElementById("salesTotal")
    .textContent =
      sales.toFixed(2) + "€";

}


/* PRODUCTS */

function renderProducts(){

  const box =
    document.getElementById("productsList");


  const search =
    document.getElementById("productSearch")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    getMyProducts().filter(p => {

      const text =
        `${p.name || ""} ${p.category || ""}`
          .toLowerCase();

      return text.includes(search);

    });


  if(!filtered.length){

    box.innerHTML = `

      <div class="empty">

        <h3>
          Nuk ke produkte.
        </h3>

        <p style="margin-top:8px;">
          Shto produktin e parë të dyqanit.
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML =
    filtered.map(p => `

      <div class="product">

        <div class="product-image">

          <img
            src="${escapeHTML(p.image || "")}"
            onerror="this.style.display='none'"
          >

        </div>


        <div class="product-info">

          <div class="category">
            ${escapeHTML(
              p.category || "Të tjera"
            )}
          </div>


          <div class="product-name">
            ${escapeHTML(
              p.name || "Produkt"
            )}
          </div>


          <div class="price">
            ${Number(p.price || 0).toFixed(2)}€
          </div>


          <div class="product-actions">

            <button
              class="action"
              onclick="editProduct('${p.id}')"
            >
              Ndrysho
            </button>

            <button
              class="action delete"
              onclick="deleteProduct('${p.id}')"
            >
              Fshi
            </button>

          </div>

        </div>

      </div>

    `).join("");

}


/* ORDERS */

function renderOrders(){

  const box =
    document.getElementById("ordersList");


  const myOrders =
    getMyOrders();


  if(!myOrders.length){

    box.innerHTML = `

      <div class="empty">

        <h3>
          Nuk ka porosi ende.
        </h3>

        <p style="margin-top:8px;">
          Kur dikush të blejë një produkt,
          porosia do të shfaqet këtu.
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML = `

    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>Data</th>

          <th>Produktet</th>

          <th>Klienti</th>

          <th>Totali</th>

          <th>Statusi</th>

        </tr>

      </thead>


      <tbody>

        ${myOrders.map(order => `

          <tr>

            <td>
              <strong>
                #${escapeHTML(order.id)}
              </strong>
            </td>


            <td>
              ${escapeHTML(
                order.date || "-"
              )}
            </td>


            <td>

              <div class="order-products">

                ${order.items.map(item => `

                  • ${escapeHTML(item.name)}
                  ×${Number(item.qty || 1)}

                  <br>

                `).join("")}

              </div>

            </td>


            <td>
              ${escapeHTML(
                order.customer || "Klient"
              )}
            </td>


            <td>
              <strong>
                ${Number(
                  order.sellerTotal || 0
                ).toFixed(2)}€
              </strong>
            </td>


            <td>

              <span class="badge orange">
                ${escapeHTML(
                  order.status || "E re"
                )}
              </span>

            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>

  `;

}


/* OPEN MODAL */

function openProductModal(){

  document.getElementById("modalTitle")
    .textContent =
      "Shto produkt";


  document.getElementById("editId")
    .value = "";


  document.getElementById("productName")
    .value = "";


  document.getElementById("productPrice")
    .value = "";


  document.getElementById("productCategory")
    .value = "Fashion";


  document.getElementById("productImage")
    .value = "";


  document.getElementById("productDescription")
    .value = "";


  document.getElementById("productModal")
    .classList.add("show");

}


/* CLOSE MODAL */

function closeProductModal(){

  document.getElementById("productModal")
    .classList.remove("show");

}


/* SAVE PRODUCT */

function saveProduct(){

  const editId =
    document.getElementById("editId")
      .value;


  const name =
    document.getElementById("productName")
      .value.trim();


  const price =
    Number(
      document.getElementById("productPrice")
        .value
    );


  const category =
    document.getElementById("productCategory")
      .value;


  const image =
    document.getElementById("productImage")
      .value.trim();


  const description =
    document.getElementById("productDescription")
      .value.trim();


  if(!currentShop){

    alert(
      "Nuk u gjet dyqani i shitësit."
    );

    return;

  }


  if(!name || !price){

    alert(
      "Vendos emrin dhe çmimin e produktit."
    );

    return;

  }


  /* EDIT */

  if(editId){

    const product =
      products.find(
        p => String(p.id) === String(editId)
      );


    if(product){

      product.name = name;

      product.price = price;

      product.category = category;

      product.image = image;

      product.description = description;

    }

  }


  /* NEW */

  else{

    const first =
      products.find(
        p =>
          (p.seller || p.sellerName || "") ===
          currentShop
      );


    const sellerName =
      first?.sellerName ||
      currentShop;


    const sellerPhone =
      first?.sellerPhone ||
      "";


    products.unshift({

      id:
        "seller_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2,7),

      name:name,

      price:price,

      category:category,

      seller:currentShop,

      sellerName:sellerName,

      sellerPhone:sellerPhone,

      image:image,

      description:description

    });

  }


  saveProducts();

  closeProductModal();

  renderAll();

  alert(
    editId
      ? "Produkti u ndryshua."
      : "Produkti u shtua me sukses."
  );

}


/* EDIT */

function editProduct(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );


  if(!product) return;


  document.getElementById("modalTitle")
    .textContent =
      "Ndrysho produkt";


  document.getElementById("editId")
    .value =
      product.id;


  document.getElementById("productName")
    .value =
      product.name || "";


  document.getElementById("productPrice")
    .value =
      product.price || "";


  document.getElementById("productCategory")
    .value =
      product.category || "Të tjera";


  document.getElementById("productImage")
    .value =
      product.image || "";


  document.getElementById("productDescription")
    .value =
      product.description || "";


  document.getElementById("productModal")
    .classList.add("show");

}


/* DELETE */

function deleteProduct(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );


  if(!product) return;


  const ok =
    confirm(
      `Do të fshish "${product.name}"?`
    );


  if(!ok) return;


  products =
    products.filter(
      p => String(p.id) !== String(id)
    );


  saveProducts();

  renderAll();

}


/* SECTION */

function showSection(id,button){

  document
    .querySelectorAll(".section")
    .forEach(section =>
      section.classList.remove("active")
    );


  if(id === "products"){

    document
      .getElementById("productsSection")
      .classList.add("active");

  }


  if(id === "orders"){

    document
      .getElementById("ordersSection")
      .classList.add("active");

  }


  document
    .querySelectorAll(".nav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  button.classList.add("active");


  renderAll();

}


/* RENDER ALL */

function renderAll(){

  renderShop();

  updateStats();

  renderProducts();

  renderOrders();

}


/* MARKETPLACE */

function goMarketplace(){

  window.location.href =
    "index.html";

}


/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "sabiUserRole"
  );

  localStorage.removeItem(
    "sabiUserContact"
  );

  window.location.href =
    "login.html";

}


/* MODAL OUTSIDE CLICK */

document
  .getElementById("productModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeProductModal();

      }

    }
  );


/* START */

renderAll();

</script>

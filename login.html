<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyr — SHIT.BLEJ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f7;
  color:#17191c;
  min-height:100vh;
}

/* TOP BAR */

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e2e4e7;
  display:flex;
  align-items:center;
  padding:0 25px;
}

.logo{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1.5px;
}

.logo span{
  color:#18a957;
}

/* PAGE */

.page{
  min-height:calc(100vh - 68px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #e1e3e6;
  border-radius:10px;
  padding:30px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.login-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:7px;
}

.login-subtitle{
  color:#73777d;
  font-size:14px;
  margin-bottom:25px;
}

/* FORM */

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  height:46px;
  border:1px solid #d8dbdf;
  border-radius:7px;
  padding:0 13px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.field input:focus,
.field select:focus{
  border-color:#18a957;
}

/* BUTTON */

.login-btn{
  width:100%;
  height:47px;
  border:0;
  border-radius:7px;
  background:#18a957;
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  margin-top:5px;
}

.login-btn:hover{
  background:#128044;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* LINKS */

.bottom{
  text-align:center;
  margin-top:20px;
  color:#777;
  font-size:13px;
}

.bottom button{
  border:0;
  background:none;
  color:#18a957;
  font-weight:800;
  cursor:pointer;
}

/* ERROR */

.error{
  display:none;
  background:#fff1f1;
  border:1px solid #ffd1d1;
  color:#c62828;
  padding:11px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:15px;
}

.error.show{
  display:block;
}

/* SUCCESS */

.success{
  display:none;
  background:#effaf3;
  border:1px solid #c9efd6;
  color:#128044;
  padding:11px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:15px;
}

.success.show{
  display:block;
}

/* MOBILE */

@media(max-width:500px){

  .topbar{
    height:60px;
    padding:0 16px;
  }

  .logo{
    font-size:24px;
  }

  .page{
    align-items:flex-start;
    padding-top:35px;
  }

  .login-box{
    padding:24px 20px;
    border-radius:9px;
  }

  .login-title{
    font-size:25px;
  }
}
</style>
</head>

<body>

<!-- SHIT.BLEJ BAR -->

<header class="topbar">
  <div class="logo">
    SHIT<span>.</span>BLEJ
  </div>
</header>


<main class="page">

  <section class="login-box">

    <h1 class="login-title">
      Hyr në SHIT.BLEJ
    </h1>

    <p class="login-subtitle">
      Hyr në llogarinë tënde për të vazhduar.
    </p>

    <div
      id="error"
      class="error"
    ></div>

    <div
      id="success"
      class="success"
    >
      Hyrja u krye me sukses. Po hapim SHIT.BLEJ...
    </div>


    <form id="loginForm">

      <div class="field">

        <label>
          Email ose username
        </label>

        <input
          id="identifier"
          type="text"
          autocomplete="username"
          placeholder="Shkruaj email-in"
          required
        >

      </div>


      <div class="field">

        <label>
          Fjalëkalimi
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Fjalëkalimi"
          required
        >

      </div>


      <div class="field">

        <label>
          Lloji i llogarisë
        </label>

        <select id="role">

          <option value="customer">
            Blerës
          </option>

          <option value="seller">
            Shitës
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>


      <button
        id="loginBtn"
        class="login-btn"
        type="submit"
      >
        HYR
      </button>

    </form>


    <div class="bottom">

      Nuk ke llogari?

      <button
        onclick="register()"
      >
        Regjistrohu
      </button>

    </div>

  </section>

</main>


<script>

const API =
  location.hostname.includes("github.io")
    ? "https://sabi-marketplace.babasabfreefire2.workers.dev/api"
    : "/api";


const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginBtn");

const errorBox =
  document.getElementById("error");

const successBox =
  document.getElementById("success");


function showError(message){

  successBox.classList.remove("show");

  errorBox.textContent=message;

  errorBox.classList.add("show");
}


function showSuccess(){

  errorBox.classList.remove("show");

  successBox.classList.add("show");
}


form.addEventListener("submit",async function(e){

  e.preventDefault();

  const identifier =
    document.getElementById("identifier")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  const role =
    document.getElementById("role")
      .value;


  if(!identifier || !password){

    showError(
      "Plotëso email-in dhe fjalëkalimin."
    );

    return;
  }


  button.disabled=true;

  button.textContent=
    "DUKE HYRË...";


  try{

    const response =
      await fetch(
        `${API}/auth/login`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            identifier:identifier,

            password:password,

            role:role

          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Email ose fjalëkalim i gabuar."
      );
    }


    /*
      RUANI SESSION
    */

    if(data.token){

      localStorage.setItem(
        "sabiAuthToken",
        data.token
      );

    }else if(data.session?.token){

      localStorage.setItem(
        "sabiAuthToken",
        data.session.token
      );

    }


    const user =
      data.user ||
      data.account ||
      {};


    if(user.id !== undefined){

      localStorage.setItem(
        "sabiUserId",
        String(user.id)
      );

    }


    localStorage.setItem(
      "sabiUserName",
      user.name ||
      user.username ||
      identifier
    );


    localStorage.setItem(
      "sabiUserRole",
      user.role ||
      role
    );


    localStorage.setItem(
      "sabiUserContact",
      user.email ||
      identifier
    );


    showSuccess();


    /*
      ADMIN
    */

    if(
      (user.role || role)==="admin"
    ){

      setTimeout(()=>{
        location.href="admin.html";
      },700);

      return;
    }


    /*
      USER / SELLER
    */

    setTimeout(()=>{
      location.href="index.html";
    },700);


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Ndodhi një gabim gjatë hyrjes."
    );

    button.disabled=false;

    button.textContent="HYR";
  }

});


function register(){

  /*
    Nëse më vonë krijojmë register.html,
    ky buton do të hapë atë faqe.
  */

  location.href="register.html";
}

</script>

</body>
</html>

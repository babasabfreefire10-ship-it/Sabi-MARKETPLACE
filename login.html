<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SABI • Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
}

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.line{
  position:absolute;
  width:45%;
  height:1px;
  background:linear-gradient(90deg,transparent,#555,transparent);
  animation:move 5s linear infinite;
}

.line:nth-child(1){
  top:25%;
  left:-20%;
}

.line:nth-child(2){
  top:70%;
  right:-20%;
  animation-delay:2s;
}

@keyframes move{
  from{transform:translateX(0)}
  to{transform:translateX(150%)}
}

.box{
  position:relative;
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid #292929;
  border-radius:25px;
  background:rgba(15,15,15,.94);
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:6px;
}

.logo span{
  color:#777;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-top:7px;
  margin-bottom:28px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  padding:5px;
  background:#080808;
  border:1px solid #292929;
  border-radius:13px;
  margin-bottom:22px;
}

.tab{
  border:0;
  padding:11px;
  border-radius:9px;
  background:transparent;
  color:#777;
}

.tab.active{
  background:#fff;
  color:#000;
  font-weight:800;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

.input{
  width:100%;
  background:#080808;
  border:1px solid #303030;
  color:#fff;
  padding:14px;
  border-radius:11px;
  outline:none;
  margin-bottom:15px;
}

.input:focus{
  border-color:#666;
}

.main-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:900;
  margin-top:4px;
}

.secondary{
  width:100%;
  border:1px solid #333;
  padding:13px;
  border-radius:12px;
  background:#151515;
  color:#fff;
  margin-top:10px;
}

.note{
  text-align:center;
  color:#666;
  font-size:12px;
  line-height:1.5;
  margin-top:18px;
}

.back{
  display:block;
  text-align:center;
  color:#888;
  text-decoration:none;
  margin-top:20px;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

.message{
  display:none;
  margin-bottom:15px;
  padding:11px;
  border-radius:10px;
  background:#171717;
  border:1px solid #333;
  color:#aaa;
  font-size:13px;
}

@media(max-width:450px){
  .box{
    padding:24px 20px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="line"></div>
  <div class="line"></div>
</div>


<div class="box">

  <div class="logo">
    SABI<span>.</span>
  </div>

  <div class="subtitle">
    Marketplace
  </div>


  <div class="tabs">

    <button
      id="customerTab"
      class="tab active"
      onclick="showForm('customer')">
      Klient
    </button>

    <button
      id="sellerTab"
      class="tab"
      onclick="showForm('seller')">
      Shitës
    </button>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <!-- CUSTOMER -->

  <div
    id="customerForm"
    class="form active">

    <label>Email ose telefon</label>

    <input
      id="customerContact"
      class="input"
      placeholder="Email ose 06xxxxxxxx">


    <label>Fjalëkalimi</label>

    <input
      id="customerPassword"
      class="input"
      type="password"
      placeholder="••••••••">


    <button
      class="main-btn"
      onclick="loginCustomer()">
      HYR SI KLIENT
    </button>


    <button
      class="secondary"
      onclick="registerCustomer()">
      KRIJO LLOGARI
    </button>

  </div>


  <!-- SELLER -->

  <div
    id="sellerForm"
    class="form">

    <label>Email ose telefon</label>

    <input
      id="sellerContact"
      class="input"
      placeholder="Email ose 06xxxxxxxx">


    <label>Fjalëkalimi</label>

    <input
      id="sellerPassword"
      class="input"
      type="password"
      placeholder="••••••••">


    <button
      class="main-btn"
      onclick="loginSeller()">
      HYR SI SHITËS
    </button>


    <button
      class="secondary"
      onclick="registerSeller()">
      HAP DYQANIN TIM
    </button>

  </div>


  <div class="note">
    Ky është versioni demo i SABI Marketplace.
    Llogaritë reale do të lidhen me database në versionin tjetër.
  </div>


  <a
    class="back"
    href="index.html">
    ← Kthehu te Marketplace
  </a>

</div>


<script>

function showForm(type){

  const customer =
    document.getElementById("customerForm");

  const seller =
    document.getElementById("sellerForm");

  const customerTab =
    document.getElementById("customerTab");

  const sellerTab =
    document.getElementById("sellerTab");


  if(type === "customer"){

    customer.classList.add("active");
    seller.classList.remove("active");

    customerTab.classList.add("active");
    sellerTab.classList.remove("active");

  }else{

    seller.classList.add("active");
    customer.classList.remove("active");

    sellerTab.classList.add("active");
    customerTab.classList.remove("active");

  }

  clearMessage();

}


function showMessage(text){

  const box =
    document.getElementById("message");

  box.textContent = text;
  box.style.display = "block";

}


function clearMessage(){

  document.getElementById("message")
    .style.display = "none";

}


function loginCustomer(){

  const contact =
    document.getElementById("customerContact")
      .value.trim();

  const password =
    document.getElementById("customerPassword")
      .value;


  if(!contact || !password){

    showMessage(
      "Plotëso kontaktin dhe fjalëkalimin."
    );

    return;

  }


  /*
    DEMO LOGIN
    Për momentin nuk verifikon database.
  */

  localStorage.setItem(
    "sabiUserRole",
    "customer"
  );

  localStorage.setItem(
    "sabiUserContact",
    contact
  );


  showMessage(
    "U identifikove si klient. Po hapim Marketplace..."
  );


  setTimeout(() => {

    window.location.href =
      "index.html";

  },800);

}


function loginSeller(){

  const contact =
    document.getElementById("sellerContact")
      .value.trim();

  const password =
    document.getElementById("sellerPassword")
      .value;


  if(!contact || !password){

    showMessage(
      "Plotëso kontaktin dhe fjalëkalimin."
    );

    return;

  }


  localStorage.setItem(
    "sabiUserRole",
    "seller"
  );

  localStorage.setItem(
    "sabiUserContact",
    contact
  );


  showMessage(
    "U identifikove si shitës. Po hapim panelin..."
  );


  setTimeout(() => {

    window.location.href =
      "seller.html";

  },800);

}


function registerCustomer(){

  showMessage(
    "Regjistrimi real do të aktivizohet kur të lidhim database."
  );

}


function registerSeller(){

  localStorage.setItem(
    "sabiUserRole",
    "seller"
  );


  showMessage(
    "Po përgatisim dyqanin tënd..."
  );


  setTimeout(() => {

    window.location.href =
      "seller.html";

  },800);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyr — SHIT.BLEJ</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f7;
  color:#17191c;
  min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e2e4e7;

  display:flex;
  align-items:center;

  padding:0 25px;
}

.logo{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1.6px;
}

.logo span{
  color:#18a957;
}


/* =========================
   PAGE
========================= */

.page{
  min-height:calc(100vh - 68px);

  display:flex;
  justify-content:center;
  align-items:center;

  padding:25px 15px;
}


/* =========================
   LOGIN BOX
========================= */

.login-box{
  width:100%;
  max-width:430px;

  background:#fff;

  border:1px solid #e1e3e6;
  border-radius:10px;

  padding:30px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.06);
}

.login-title{
  font-size:28px;
  font-weight:900;

  margin-bottom:7px;
}

.login-subtitle{
  color:#73777d;
  font-size:14px;

  margin-bottom:25px;
}


/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  padding:12px;

  border-radius:7px;

  font-size:13px;

  margin-bottom:15px;
}

.message.show{
  display:block;
}

.error{
  background:#fff1f1;
  border:1px solid #ffd1d1;
  color:#c62828;
}

.success{
  background:#effaf3;
  border:1px solid #c9efd6;
  color:#128044;
}


/* =========================
   INPUTS
========================= */

.field{
  margin-bottom:15px;
}

.field label{
  display:block;

  font-size:13px;
  font-weight:700;

  margin-bottom:7px;
}

.field input,
.field select{

  width:100%;
  height:46px;

  border:1px solid #d8dbdf;
  border-radius:7px;

  padding:0 13px;

  font-size:14px;

  outline:none;

  background:#fff;
}

.field input:focus,
.field select:focus{
  border-color:#18a957;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

  width:100%;
  height:47px;

  border:0;
  border-radius:7px;

  background:#18a957;
  color:#fff;

  font-weight:800;
  font-size:15px;

  cursor:pointer;

  margin-top:5px;

  transition:.15s;
}

.login-btn:hover{
  background:#128044;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* =========================
   REGISTER
========================= */

.bottom{
  text-align:center;

  margin-top:20px;

  color:#777;

  font-size:13px;
}

.register-btn{

  border:0;
  background:none;

  color:#18a957;

  font-weight:800;

  cursor:pointer;

  margin-left:4px;
}

.register-btn:hover{
  text-decoration:underline;
}


/* =========================
   COUNTDOWN
========================= */

.countdown-overlay{

  position:fixed;
  inset:0;

  background:rgba(255,255,255,.98);

  z-index:99999;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;
}

.countdown-overlay.show{
  display:flex;
}

.countdown-logo{

  font-size:34px;

  font-weight:950;

  letter-spacing:-2px;

  margin-bottom:28px;
}

.countdown-logo span{
  color:#18a957;
}

.countdown-number{

  font-size:105px;

  font-weight:950;

  color:#18a957;

  line-height:1;

  animation:countdownPop .8s ease;
}

.countdown-text{

  margin-top:18px;

  color:#777;

  font-size:14px;
}

.countdown-bar{

  width:240px;
  height:5px;

  background:#e4e5e7;

  border-radius:20px;

  overflow:hidden;

  margin-top:22px;
}

.countdown-progress{

  width:100%;
  height:100%;

  background:#18a957;

  transform-origin:left;
}

@keyframes countdownPop{

  0%{
    transform:scale(.3);
    opacity:0;
  }

  70%{
    transform:scale(1.15);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .topbar{
    height:60px;
    padding:0 16px;
  }

  .logo{
    font-size:24px;
  }

  .page{
    align-items:flex-start;
    padding-top:35px;
  }

  .login-box{
    padding:24px 20px;
  }

  .login-title{
    font-size:25px;
  }

  .countdown-number{
    font-size:90px;
  }

}

</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

  <div class="logo">
    SHIT<span>.</span>BLEJ
  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<main class="page">

  <section class="login-box">

    <h1 class="login-title">
      Hyr në SHIT.BLEJ
    </h1>

    <p class="login-subtitle">
      Hyr në llogarinë tënde për të vazhduar.
    </p>


    <div
      id="error"
      class="message error"
    ></div>


    <div
      id="success"
      class="message success"
    >
      Hyrja u krye me sukses.
    </div>


    <form id="loginForm">


      <!-- EMAIL -->

      <div class="field">

        <label>
          Email ose username
        </label>

        <input
          id="identifier"
          type="text"
          autocomplete="username"
          placeholder="Shkruaj email-in"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label>
          Fjalëkalimi
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Fjalëkalimi"
          required
        >

      </div>


      <!-- ROLE -->

      <div class="field">

        <label>
          Lloji i llogarisë
        </label>

        <select id="role">

          <option value="customer">
            Blerës
          </option>

          <option value="seller">
            Shitës
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>


      <!-- LOGIN -->

      <button
        id="loginBtn"
        class="login-btn"
        type="submit"
      >
        HYR
      </button>


    </form>


    <!-- REGISTER -->

    <div class="bottom">

      Nuk ke llogari?

      <button
        type="button"
        class="register-btn"
        onclick="goRegister()"
      >
        Regjistrohu
      </button>

    </div>

  </section>

</main>


<!-- =========================
     COUNTDOWN
========================= -->

<div
  id="countdownOverlay"
  class="countdown-overlay"
>

  <div class="countdown-logo">
    SHIT<span>.</span>BLEJ
  </div>


  <div
    id="countdownNumber"
    class="countdown-number"
  >
    3
  </div>


  <div class="countdown-text">
    Po hyjmë në SHIT.BLEJ...
  </div>


  <div class="countdown-bar">

    <div
      id="countdownProgress"
      class="countdown-progress"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API =
  location.hostname.includes("github.io")
    ? "https://sabi-marketplace.babasabfreefire2.workers.dev/api"
    : "/api";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const errorBox =
  document.getElementById("error");

const successBox =
  document.getElementById("success");

const countdownOverlay =
  document.getElementById(
    "countdownOverlay"
  );

const countdownNumber =
  document.getElementById(
    "countdownNumber"
  );

const countdownProgress =
  document.getElementById(
    "countdownProgress"
  );


/* =====================================================
   MESSAGE
===================================================== */

function showError(message){

  successBox.classList.remove("show");

  errorBox.textContent =
    message;

  errorBox.classList.add("show");
}


function showSuccess(){

  errorBox.classList.remove("show");

  successBox.classList.add("show");
}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(destination){

  countdownOverlay.classList.add("show");

  let count = 3;

  countdownNumber.textContent =
    count;

  countdownNumber.style.animation =
    "none";

  void countdownNumber.offsetWidth;

  countdownNumber.style.animation =
    "countdownPop .8s ease";


  countdownProgress.style.transition =
    "none";

  countdownProgress.style.width =
    "100%";


  setTimeout(()=>{

    countdownProgress.style.transition =
      "width 3s linear";

    countdownProgress.style.width =
      "0%";

  },50);


  const timer =
    setInterval(()=>{

      count--;


      if(count > 0){

        countdownNumber.textContent =
          count;

        countdownNumber.style.animation =
          "none";

        void countdownNumber.offsetWidth;

        countdownNumber.style.animation =
          "countdownPop .8s ease";

      }

      else{

        clearInterval(timer);

        countdownNumber.textContent =
          "✓";

        countdownNumber.style.animation =
          "none";

        void countdownNumber.offsetWidth;

        countdownNumber.style.animation =
          "countdownPop .8s ease";


        setTimeout(()=>{

          window.location.href =
            destination;

        },450);

      }

    },1000);

}


/* =====================================================
   REGISTER
===================================================== */

function goRegister(){

  /*
    Hap register.html.
  */

  window.location.href =
    "register.html";
}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const identifier =
      document
        .getElementById("identifier")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const role =
      document
        .getElementById("role")
        .value;


    if(!identifier){

      showError(
        "Shkruaj email-in ose username."
      );

      return;
    }


    if(!password){

      showError(
        "Shkruaj fjalëkalimin."
      );

      return;
    }


    errorBox.classList.remove(
      "show"
    );


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "DUKE HYRË...";


    try{

      const response =
        await fetch(
          `${API}/auth/login`,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              identifier:
                identifier,

              password:
                password,

              role:
                role

            })
          }
        );


      let data = {};

      try{

        data =
          await response.json();

      }catch(e){

        data = {};

      }


      if(!response.ok){

        throw new Error(
          data.error ||
          data.message ||
          "Email ose fjalëkalim i gabuar."
        );

      }


      /* ==========================
         TOKEN
      ========================== */

      const token =
        data.token ||
        data.session?.token ||
        data.access_token;


      if(!token){

        throw new Error(
          "Serveri nuk ktheu token-in e login-it."
        );

      }


      localStorage.setItem(
        "sabiAuthToken",
        token
      );


      /*
        Për versionet e reja
      */

      localStorage.setItem(
        "shitblej_token",
        token
      );


      /* ==========================
         USER
      ========================== */

      const user =
        data.user ||
        data.account ||
        {};


      const userId =
        user.id ??
        data.user_id ??
        "";


      const userName =
        user.name ||
        user.username ||
        identifier;


      const userRole =
        user.role ||
        role;


      const userContact =
        user.email ||
        user.identifier ||
        identifier;


      localStorage.setItem(
        "sabiUserId",
        String(userId)
      );


      localStorage.setItem(
        "sabiUserName",
        userName
      );


      localStorage.setItem(
        "sabiUserRole",
        userRole
      );


      localStorage.setItem(
        "sabiUserContact",
        userContact
      );


      /* ==========================
         SUCCESS
      ========================== */

      showSuccess();


      loginBtn.textContent =
        "✓ U HYRE";


      /* ==========================
         ADMIN
      ========================== */

      if(userRole === "admin"){

        startCountdown(
          "admin.html"
        );

        return;
      }


      /* ==========================
         USER / SELLER
      ========================== */

      startCountdown(
        "index.html"
      );


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      showError(
        error.message ||
        "Nuk mund të bëhet login."
      );


      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "HYR";

    }

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SABI • Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
}

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.line{
  position:absolute;
  width:45%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #555,
    transparent
  );
  animation:move 5s linear infinite;
}

.line:nth-child(1){
  top:25%;
  left:-20%;
}

.line:nth-child(2){
  top:70%;
  right:-20%;
  animation-delay:2s;
}

@keyframes move{
  from{
    transform:translateX(0)
  }
  to{
    transform:translateX(150%)
  }
}

.box{
  position:relative;
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid #292929;
  border-radius:25px;
  background:rgba(15,15,15,.94);
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:6px;
}

.logo span{
  color:#777;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-top:7px;
  margin-bottom:28px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  padding:5px;
  background:#080808;
  border:1px solid #292929;
  border-radius:13px;
  margin-bottom:22px;
}

.tab{
  border:0;
  padding:11px 5px;
  border-radius:9px;
  background:transparent;
  color:#777;
  cursor:pointer;
  font-weight:700;
}

.tab.active{
  background:#fff;
  color:#000;
  font-weight:900;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

.input{
  width:100%;
  background:#080808;
  border:1px solid #303030;
  color:#fff;
  padding:14px;
  border-radius:11px;
  outline:none;
  margin-bottom:15px;
}

.input:focus{
  border-color:#666;
}

.main-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:900;
  margin-top:4px;
  cursor:pointer;
}

.main-btn:disabled{
  opacity:.5;
}

.secondary{
  width:100%;
  border:1px solid #333;
  padding:13px;
  border-radius:12px;
  background:#151515;
  color:#fff;
  margin-top:10px;
  cursor:pointer;
}

.note{
  text-align:center;
  color:#666;
  font-size:12px;
  line-height:1.5;
  margin-top:18px;
}

.back{
  display:block;
  text-align:center;
  color:#888;
  text-decoration:none;
  margin-top:20px;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

.message{
  display:none;
  margin-bottom:15px;
  padding:11px;
  border-radius:10px;
  background:#171717;
  border:1px solid #333;
  color:#aaa;
  font-size:13px;
}

.admin-badge{
  display:inline-block;
  margin-bottom:18px;
  padding:6px 10px;
  border-radius:999px;
  background:#171717;
  border:1px solid #333;
  color:#aaa;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
}

@media(max-width:450px){
  .box{
    padding:24px 20px;
  }

  .tabs{
    gap:4px;
  }

  .tab{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="line"></div>
  <div class="line"></div>
</div>

<div class="box">

  <div class="logo">
    SABI<span>.</span>
  </div>

  <div class="subtitle">
    Marketplace
  </div>

  <!-- TABS -->
  <div class="tabs">

    <button
      id="customerTab"
      class="tab active"
      onclick="showForm('customer')">
      Klient
    </button>

    <button
      id="sellerTab"
      class="tab"
      onclick="showForm('seller')">
      Shitës
    </button>

    <button
      id="adminTab"
      class="tab"
      onclick="showForm('admin')">
      Admin
    </button>

  </div>

  <div
    id="message"
    class="message">
  </div>


  <!-- ========================= -->
  <!-- CUSTOMER -->
  <!-- ========================= -->

  <div
    id="customerForm"
    class="form active">

    <label>Email ose telefon</label>

    <input
      id="customerContact"
      class="input"
      autocomplete="username"
      placeholder="Email ose 06xxxxxxxx">

    <label>Fjalëkalimi</label>

    <input
      id="customerPassword"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••">

    <button
      id="customerLoginBtn"
      class="main-btn"
      onclick="loginCustomer()">

      HYR SI KLIENT

    </button>

    <button
      class="secondary"
      onclick="registerCustomer()">

      KRIJO LLOGARI

    </button>

  </div>


  <!-- ========================= -->
  <!-- SELLER -->
  <!-- ========================= -->

  <div
    id="sellerForm"
    class="form">

    <label>Email ose telefon</label>

    <input
      id="sellerContact"
      class="input"
      autocomplete="username"
      placeholder="Email ose 06xxxxxxxx">

    <label>Fjalëkalimi</label>

    <input
      id="sellerPassword"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••">

    <button
      id="sellerLoginBtn"
      class="main-btn"
      onclick="loginSeller()">

      HYR SI SHITËS

    </button>

    <button
      class="secondary"
      onclick="registerSeller()">

      HAP DYQANIN TIM

    </button>

  </div>


  <!-- ========================= -->
  <!-- ADMIN -->
  <!-- ========================= -->

  <div
    id="adminForm"
    class="form">

    <div style="text-align:center;">
      <div class="admin-badge">
        SABI ADMIN PANEL
      </div>
    </div>

    <label>Email ose telefon</label>

    <input
      id="adminContact"
      class="input"
      autocomplete="username"
      placeholder="Email ose 06xxxxxxxx">

    <label>Fjalëkalimi</label>

    <input
      id="adminPassword"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••">

    <button
      id="adminLoginBtn"
      class="main-btn"
      onclick="loginAdmin()">

      HYR SI ADMIN

    </button>

    <div
      style="
        text-align:center;
        color:#555;
        font-size:12px;
        line-height:1.5;
        margin-top:14px;
      ">

      Hyrja e administratorit është vetëm
      për llogaritë e autorizuara.

    </div>

  </div>


  <div class="note">
    Llogaritë ruhen në database-in e SABI.
    Fjalëkalimet nuk ruhen si tekst.
  </div>

  <a
    class="back"
    href="index.html">

    ← Kthehu te Marketplace

  </a>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API =
  location.hostname.includes("github.io")
    ? "https://sabi-marketplace.babasabfreefire2.workers.dev/api"
    : "/api";


/* =====================================================
   FORM SWITCH
===================================================== */

function showForm(type){

  const customer =
    document.getElementById("customerForm");

  const seller =
    document.getElementById("sellerForm");

  const admin =
    document.getElementById("adminForm");

  const customerTab =
    document.getElementById("customerTab");

  const sellerTab =
    document.getElementById("sellerTab");

  const adminTab =
    document.getElementById("adminTab");


  customer.classList.remove("active");
  seller.classList.remove("active");
  admin.classList.remove("active");

  customerTab.classList.remove("active");
  sellerTab.classList.remove("active");
  adminTab.classList.remove("active");


  if(type === "customer"){

    customer.classList.add("active");
    customerTab.classList.add("active");

  }

  else if(type === "seller"){

    seller.classList.add("active");
    sellerTab.classList.add("active");

  }

  else if(type === "admin"){

    admin.classList.add("active");
    adminTab.classList.add("active");

  }

  clearMessage();
}


/* =====================================================
   MESSAGES
===================================================== */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.textContent = text;
  box.style.display = "block";
}


function clearMessage(){

  document.getElementById("message")
    .style.display = "none";

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(id, loading){

  const btn =
    document.getElementById(id);

  if(!btn) return;

  btn.disabled = loading;

  if(loading){

    btn.dataset.oldText =
      btn.textContent;

    btn.textContent =
      "DUKE PËRPUNUAR...";

  }else{

    btn.textContent =
      btn.dataset.oldText ||
      btn.textContent;

  }
}


/* =====================================================
   SAVE SESSION
===================================================== */

function saveSession(data){

  localStorage.setItem(
    "sabiAuthToken",
    data.token
  );

  localStorage.setItem(
    "sabiUserId",
    String(data.user.id)
  );

  localStorage.setItem(
    "sabiUserRole",
    data.user.role
  );

  localStorage.setItem(
    "sabiUserContact",
    data.user.identifier ||
    data.user.email ||
    ""
  );

  localStorage.setItem(
    "sabiUserName",
    data.user.name ||
    ""
  );

  localStorage.setItem(
    "sabiUserEmail",
    data.user.email ||
    ""
  );
}


/* =====================================================
   LOGIN
===================================================== */

async function login(
  role,
  contact,
  password
){

  let buttonId;

  if(role === "seller"){
    buttonId = "sellerLoginBtn";
  }

  else if(role === "admin"){
    buttonId = "adminLoginBtn";
  }

  else{
    buttonId = "customerLoginBtn";
  }


  setLoading(buttonId,true);
  clearMessage();


  try{

    const response =
      await fetch(
        `${API}/auth/login`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            identifier:contact,

            password:password,

            role:role

          })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      showMessage(
        data.error ||
        "Login-i dështoi."
      );

      return;
    }


    /*
      Kontroll ekstra:
      nëse kërkohet ADMIN,
      serveri duhet të kthejë
      role=admin.
    */

    if(
      role === "admin" &&
      data.user.role !== "admin"
    ){

      showMessage(
        "Kjo llogari nuk ka të drejta administratori."
      );

      return;
    }


    saveSession(data);


    if(role === "admin"){

      showMessage(
        "U identifikove si ADMIN. Po hapim panelin..."
      );

    }

    else if(role === "seller"){

      showMessage(
        "U identifikove. Po hapim panelin e shitësit..."
      );

    }

    else{

      showMessage(
        "U identifikove. Po hapim Marketplace..."
      );

    }


    setTimeout(() => {

      if(role === "admin"){

        window.location.href =
          "admin.html";

      }

      else if(role === "seller"){

        window.location.href =
          "seller.html";

      }

      else{

        window.location.href =
          "index.html";

      }

    },700);


  }catch(error){

    console.error(error);

    showMessage(
      "Nuk u lidhëm me serverin. Kontrollo internetin."
    );

  }finally{

    setLoading(buttonId,false);

  }

}


/* =====================================================
   CUSTOMER LOGIN
===================================================== */

function loginCustomer(){

  const contact =
    document.getElementById(
      "customerContact"
    ).value.trim();

  const password =
    document.getElementById(
      "customerPassword"
    ).value;


  if(!contact || !password){

    showMessage(
      "Plotëso kontaktin dhe fjalëkalimin."
    );

    return;
  }


  login(
    "customer",
    contact,
    password
  );

}


/* =====================================================
   SELLER LOGIN
===================================================== */

function loginSeller(){

  const contact =
    document.getElementById(
      "sellerContact"
    ).value.trim();

  const password =
    document.getElementById(
      "sellerPassword"
    ).value;


  if(!contact || !password){

    showMessage(
      "Plotëso kontaktin dhe fjalëkalimin."
    );

    return;
  }


  login(
    "seller",
    contact,
    password
  );

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

function loginAdmin(){

  const contact =
    document.getElementById(
      "adminContact"
    ).value.trim();

  const password =
    document.getElementById(
      "adminPassword"
    ).value;


  if(!contact || !password){

    showMessage(
      "Plotëso emailin/telefonin dhe fjalëkalimin."
    );

    return;
  }


  login(
    "admin",
    contact,
    password
  );

}


/* =====================================================
   REGISTER
===================================================== */

async function register(role){

  const name =
    prompt(
      role === "seller"
        ? "Shkruaj emrin tënd ose emrin e dyqanit:"
        : "Shkruaj emrin tënd:"
    );


  if(name === null) return;


  const cleanName =
    name.trim();


  if(!cleanName){

    showMessage(
      "Emri është i detyrueshëm."
    );

    return;
  }


  const identifier =
    prompt(
      "Shkruaj emailin ose numrin e telefonit:"
    );


  if(identifier === null) return;


  const cleanIdentifier =
    identifier.trim();


  if(!cleanIdentifier){

    showMessage(
      "Emaili ose telefoni është i detyrueshëm."
    );

    return;
  }


  const password =
    prompt(
      "Krijo një fjalëkalim (minimum 6 karaktere):"
    );


  if(password === null) return;


  if(password.length < 6){

    showMessage(
      "Fjalëkalimi duhet të ketë të paktën 6 karaktere."
    );

    return;
  }


  showMessage(
    "Po krijojmë llogarinë..."
  );


  try{

    const response =
      await fetch(
        `${API}/auth/register`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            name:cleanName,

            identifier:
              cleanIdentifier,

            password:password,

            role:role

          })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      showMessage(
        data.error ||
        "Regjistrimi dështoi."
      );

      return;
    }


    showMessage(
      "Llogaria u krijua. Tani mund të hysh."
    );


    if(role === "seller"){

      document.getElementById(
        "sellerContact"
      ).value =
        cleanIdentifier;

      document.getElementById(
        "sellerPassword"
      ).value =
        password;

    }

    else{

      document.getElementById(
        "customerContact"
      ).value =
        cleanIdentifier;

      document.getElementById(
        "customerPassword"
      ).value =
        password;

    }


  }catch(error){

    console.error(error);

    showMessage(
      "Nuk u lidhëm me serverin."
    );

  }

}


function registerCustomer(){

  register("customer");

}


function registerSeller(){

  register("seller");

}


/* =====================================================
   EXISTING SESSION
===================================================== */

async function checkExistingSession(){

  const token =
    localStorage.getItem(
      "sabiAuthToken"
    );


  if(!token) return;


  try{

    const response =
      await fetch(
        `${API}/auth/me`,
        {
          headers:{
            "Authorization":
              `Bearer ${token}`
          }
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.authenticated
    ){

      localStorage.removeItem(
        "sabiAuthToken"
      );

      return;
    }


    /*
      Nëse admini ka hyrë më parë
      dhe kthehet te login.html,
      e çojmë direkt te admin panel.
    */

    if(data.user){

      if(data.user.role === "admin"){

        window.location.href =
          "admin.html";

        return;

      }

      if(data.user.role === "seller"){

        window.location.href =
          "seller.html";

        return;

      }

    }


  }catch{

    /*
      Mos blloko login-in nëse serveri
      është përkohësisht offline.
    */

  }

}


checkExistingSession();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hyrje — SHIT.BLEJ PRO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      color: #00e676;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #0d0d0d;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #00e676;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 60px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 7px;
      height: 38px;
      border: 0;
      background: #222;
      color: #bbb;
      border-radius: 8px;
      padding: 0 10px;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #00e676;
      color: #07120b;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #999;
    }

    .register a {
      color: #00e676;
      font-weight: 800;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      background: #291414;
      border: 1px solid #633;
      color: #ffb4b4;
      font-size: 14px;
    }

    .success {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .success h2 {
      margin-bottom: 8px;
    }

    .success p {
      color: #aaa;
    }

    .spinner {
      display: inline-block;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(0,0,0,.25);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

<div class="box">

  <div id="loginContent">

    <div class="logo">
      SHIT.BLEJ
    </div>

    <div class="subtitle">
      Hyr në llogarinë tënde
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="field">

        <label for="identifier">
          Email
        </label>

        <input
          id="identifier"
          type="email"
          placeholder="email@example.com"
          autocomplete="email"
          required
        >

      </div>

      <div class="field">

        <label for="password">
          Fjalëkalimi
        </label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            placeholder="Fjalëkalimi"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Shfaq
          </button>

        </div>

      </div>

      <div class="field">

        <label for="role">
          Lloji i llogarisë
        </label>

        <select id="role">

          <option value="">
            Zgjidhe automatikisht
          </option>

          <option value="customer">
            Customer
          </option>

          <option value="seller">
            Seller
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>

      <button
        id="loginButton"
        class="login-btn"
        type="submit"
      >
        Hyr
      </button>

    </form>

    <div class="register">
      Nuk ke llogari?
      <a href="/register.html">
        Regjistrohu
      </a>
    </div>

    <a href="/" class="back">
      ← Kthehu te SHIT.BLEJ
    </a>

  </div>


  <div id="success" class="success">

    <div class="success-icon">
      ✓
    </div>

    <h2>Hyrja u krye!</h2>

    <p>
      Po të dërgojmë në marketplace...
    </p>

  </div>

</div>


<script>

const API = "/api";


/* =========================
   HELPERS
========================= */

function showMessage(message) {

  const box =
    document.getElementById("message");

  box.textContent = message;
  box.style.display = "block";

}


function hideMessage() {

  const box =
    document.getElementById("message");

  box.style.display = "none";

}


function togglePassword() {

  const input =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");

  if (input.type === "password") {

    input.type = "text";
    button.textContent = "Fshih";

  } else {

    input.type = "password";
    button.textContent = "Shfaq";

  }

}


function getNextPage() {

  const params =
    new URLSearchParams(window.location.search);

  const next =
    params.get("next");

  if (
    next &&
    next.startsWith("/") &&
    !next.startsWith("//")
  ) {
    return next;
  }

  return "/";
}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    hideMessage();

    const button =
      document.getElementById("loginButton");

    const identifier =
      document
        .getElementById("identifier")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const role =
      document
        .getElementById("role")
        .value;

    button.disabled = true;

    button.innerHTML =
      '<span class="spinner"></span>Duke hyrë...';


    try {

      const body = {
        identifier,
        email: identifier,
        password
      };

      if (role) {
        body.role = role;
      }


      const response =
        await fetch(API + "/auth/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(body)

        });


      const text =
        await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        data = {
          success: false,
          message: text
        };
      }


      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Email ose fjalëkalim i gabuar."
        );

      }


      /*
        Mbështet disa formate të Worker-it
      */

      const token =
        data.token ||
        data.access_token ||
        data.session?.token ||
        data.data?.token;

      const user =
        data.user ||
        data.account ||
        data.data?.user ||
        {};


      if (!token) {

        throw new Error(
          "Login u krye, por serveri nuk ktheu token."
        );

      }


      /*
        Ruaj token
      */

      localStorage.setItem(
        "shitblej_token",
        token
      );

      localStorage.setItem(
        "sabiAuthToken",
        token
      );


      /*
        Ruaj user
      */

      localStorage.setItem(
        "shitblej_user",
        JSON.stringify(user)
      );


      if (user.id != null) {

        localStorage.setItem(
          "sabiUserId",
          String(user.id)
        );

      }

      if (user.name) {

        localStorage.setItem(
          "sabiUserName",
          user.name
        );

      }

      if (user.role) {

        localStorage.setItem(
          "sabiUserRole",
          user.role
        );

      }

      if (user.email) {

        localStorage.setItem(
          "sabiUserEmail",
          user.email
        );

      }

      if (user.phone) {

        localStorage.setItem(
          "sabiUserPhone",
          user.phone
        );

      }


      /*
        Success
      */

      document
        .getElementById("loginContent")
        .style.display = "none";

      document
        .getElementById("success")
        .style.display = "block";


      /*
        Admin → admin
        Seller → seller
        Customer → next/home
      */

      const userRole =
        String(
          user.role ||
          data.role ||
          role ||
          "customer"
        ).toLowerCase();


      let destination =
        getNextPage();


      if (userRole === "admin") {

        destination = "/admin.html";

      } else if (
        userRole === "seller" &&
        !new URLSearchParams(window.location.search).get("next")
      ) {

        destination = "/seller.html";

      }


      setTimeout(() => {

        window.location.href =
          destination;

      }, 800);


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Ndodhi një gabim gjatë hyrjes."
      );

      button.disabled = false;

      button.textContent = "Hyr";

    }

  });


/* =========================
   ALREADY LOGGED IN
========================= */

(async function checkExistingLogin() {

  const token =
    localStorage.getItem("shitblej_token") ||
    localStorage.getItem("sabiAuthToken");

  if (!token) return;


  try {

    const response =
      await fetch(API + "/auth/me", {

        headers: {
          Authorization: "Bearer " + token
        }

      });


    if (!response.ok) return;


    const data =
      await response.json();

    const user =
      data.user ||
      data.account ||
      data.data?.user ||
      data;


    if (!user) return;


    localStorage.setItem(
      "shitblej_user",
      JSON.stringify(user)
    );


  } catch (error) {

    console.log(
      "Session check failed",
      error
    );

  }

})();

</script>

</body>
</html>

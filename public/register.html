<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regjistrohu — SHIT.BLEJ PRO</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      background:#070b09;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:430px;
      background:#0d1310;
      border:1px solid #1c2921;
      border-radius:22px;
      padding:28px 22px;
      box-shadow:0 20px 70px rgba(0,0,0,.5);
    }

    .logo{
      text-align:center;
      font-size:30px;
      font-weight:900;
      letter-spacing:-1px;
      margin-bottom:6px;
    }

    .logo span{
      color:#00ff88;
    }

    .subtitle{
      text-align:center;
      color:#8d9b92;
      font-size:14px;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-size:13px;
      color:#cbd4ce;
      font-weight:700;
    }

    input,select{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #26342c;
      background:#080d0a;
      color:#fff;
      outline:none;
      font-size:15px;
    }

    input:focus,select:focus{
      border-color:#00ff88;
      box-shadow:0 0 0 2px rgba(0,255,136,.08);
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:55px;
    }

    .show{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:none;
      color:#00ff88;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
    }

    .terms{
      display:flex;
      align-items:flex-start;
      gap:9px;
      margin:18px 0;
      color:#8d9b92;
      font-size:12px;
      line-height:1.5;
    }

    .terms input{
      width:17px;
      height:17px;
      margin-top:1px;
      accent-color:#00ff88;
    }

    .terms a{
      color:#00ff88;
      text-decoration:none;
    }

    button.register{
      width:100%;
      padding:15px;
      border:0;
      border-radius:13px;
      background:#00ff88;
      color:#001a0d;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      transition:.2s;
    }

    button.register:hover{
      transform:translateY(-1px);
      filter:brightness(1.05);
    }

    button.register:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .login{
      text-align:center;
      margin-top:20px;
      color:#8d9b92;
      font-size:14px;
    }

    .login a{
      color:#00ff88;
      font-weight:800;
      text-decoration:none;
    }

    .error{
      display:none;
      background:#351313;
      border:1px solid #6e2525;
      color:#ff9c9c;
      padding:12px;
      border-radius:10px;
      margin-top:15px;
      font-size:13px;
      line-height:1.4;
    }

    .success{
      display:none;
      text-align:center;
      padding:20px 5px;
    }

    .success-icon{
      width:65px;
      height:65px;
      border-radius:50%;
      background:#00ff88;
      color:#001a0d;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 18px;
      font-size:32px;
      font-weight:900;
    }

    .success h2{
      margin-bottom:8px;
    }

    .success p{
      color:#8d9b92;
      font-size:14px;
      line-height:1.5;
    }

    .loading{
      display:none;
      margin-top:12px;
      text-align:center;
      color:#8d9b92;
      font-size:13px;
    }

    @media(max-width:480px){
      body{
        padding:12px;
      }

      .box{
        padding:25px 18px;
        border-radius:18px;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div id="formArea">

      <div class="logo">
        SHIT<span>.</span>BLEJ
      </div>

      <div class="subtitle">
        Krijo llogarinë tënde falas
      </div>

      <form id="registerForm">

        <label for="name">Emri</label>
        <input
          id="name"
          type="text"
          placeholder="Emri yt"
          autocomplete="name"
          required
        >

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="email@example.com"
          autocomplete="email"
          required
        >

        <label for="phone">Telefon</label>
        <input
          id="phone"
          type="tel"
          placeholder="06xxxxxxxx"
          autocomplete="tel"
        >

        <label for="role">Lloji i llogarisë</label>
        <select id="role">
          <option value="customer">Blerës</option>
          <option value="seller">Shitës</option>
        </select>

        <label for="password">Fjalëkalimi</label>
        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="Minimumi 6 karaktere"
            autocomplete="new-password"
            required
          >
          <button type="button" class="show" onclick="togglePassword('password',this)">
            SHFAQ
          </button>
        </div>

        <label for="confirmPassword">Përsërit fjalëkalimin</label>
        <div class="password-wrap">
          <input
            id="confirmPassword"
            type="password"
            placeholder="Përsërite fjalëkalimin"
            autocomplete="new-password"
            required
          >
          <button type="button" class="show" onclick="togglePassword('confirmPassword',this)">
            SHFAQ
          </button>
        </div>

        <div class="terms">
          <input id="terms" type="checkbox" required>
          <div>
            Pranoj kushtet e përdorimit të
            <a href="/">SHIT.BLEJ</a>.
          </div>
        </div>

        <button class="register" id="registerBtn" type="submit">
          KRIJO LLOGARI
        </button>

        <div class="loading" id="loading">
          Po krijohet llogaria...
        </div>

        <div class="error" id="error"></div>

      </form>

      <div class="login">
        Ke tashmë llogari?
        <a href="/login.html">Hyr këtu</a>
      </div>

    </div>

    <div class="success" id="success">

      <div class="success-icon">✓</div>

      <h2>Llogaria u krijua!</h2>

      <p>
        Llogaria jote në SHIT.BLEJ u krijua me sukses.
        <br><br>
        Po të dërgojmë te hyrja...
      </p>

    </div>

  </div>


<script>

const API = "/api";

const form = document.getElementById("registerForm");
const errorBox = document.getElementById("error");
const loading = document.getElementById("loading");
const registerBtn = document.getElementById("registerBtn");

function togglePassword(id, button){

  const input = document.getElementById(id);

  if(input.type === "password"){
    input.type = "text";
    button.textContent = "FSHIH";
  }else{
    input.type = "password";
    button.textContent = "SHFAQ";
  }

}

function showError(message){

  errorBox.textContent = message;
  errorBox.style.display = "block";

}

function hideError(){

  errorBox.style.display = "none";

}


form.addEventListener("submit", async function(e){

  e.preventDefault();

  hideError();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const role =
    document.getElementById("role").value;

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const terms =
    document.getElementById("terms").checked;


  if(name.length < 2){
    showError("Vendos një emër të vlefshëm.");
    return;
  }

  if(!email.includes("@")){
    showError("Vendos një email të vlefshëm.");
    return;
  }

  if(password.length < 6){
    showError("Fjalëkalimi duhet të ketë të paktën 6 karaktere.");
    return;
  }

  if(password !== confirmPassword){
    showError("Fjalëkalimet nuk përputhen.");
    return;
  }

  if(!terms){
    showError("Duhet të pranosh kushtet e përdorimit.");
    return;
  }


  registerBtn.disabled = true;
  loading.style.display = "block";


  try{

    const response = await fetch(API + "/auth/register", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        name:name,

        email:email,

        phone:phone,

        identifier:email,

        password:password,

        role:role

      })

    });


    let data = {};

    try{
      data = await response.json();
    }catch(e){
      data = {};
    }


    if(!response.ok){

      const message =
        data.message ||
        data.error ||
        data.detail ||
        "Nuk u krijua llogaria.";

      throw new Error(message);

    }


    /*
      Nëse backend kthen token direkt,
      e ruajmë që përdoruesi të jetë i loguar.
    */

    const token =
      data.token ||
      data.access_token ||
      data.session?.token ||
      data.data?.token ||
      null;


    const user =
      data.user ||
      data.account ||
      data.data?.user ||
      null;


    if(token){

      localStorage.setItem(
        "shitblej_token",
        token
      );

      localStorage.setItem(
        "sabiAuthToken",
        token
      );

    }


    if(user){

      localStorage.setItem(
        "shitblej_user",
        JSON.stringify(user)
      );

      if(user.id != null){
        localStorage.setItem(
          "sabiUserId",
          String(user.id)
        );
      }

      if(user.name){
        localStorage.setItem(
          "sabiUserName",
          user.name
        );
      }

      if(user.email){
        localStorage.setItem(
          "sabiUserEmail",
          user.email
        );
      }

      if(user.phone){
        localStorage.setItem(
          "sabiUserPhone",
          user.phone
        );
      }

      if(user.role){
        localStorage.setItem(
          "sabiUserRole",
          user.role
        );
      }

    }


    document.getElementById("formArea").style.display = "none";
    document.getElementById("success").style.display = "block";


    let seconds = 3;

    const timer = setInterval(() => {

      seconds--;

      if(seconds <= 0){

        clearInterval(timer);

        window.location.href =
          "/login.html?registered=1";

      }

    },1000);


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Ndodhi një gabim gjatë regjistrimit."
    );

    registerBtn.disabled = false;
    loading.style.display = "none";

  }

});

</script>

</body>
</html>

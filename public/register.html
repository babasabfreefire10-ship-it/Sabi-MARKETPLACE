<!DOCTYPE html>
<html lang="sq">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Regjistrohu • SHIT.BLEJ</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #292929;
      background: #151515;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
    }

    .logo span {
      color: #20a83a;
    }

    .back {
      background: #292929;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      width: 92%;
      max-width: 450px;
      margin: 45px auto;
    }

    .card {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 25px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #bbb;
      font-size: 14px;
      margin-bottom: 7px;
      margin-top: 16px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #101010;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #20a83a;
    }

    .roles {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .role {
      flex: 1;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 13px;
      background: #101010;
      cursor: pointer;
      text-align: center;
      color: #aaa;
    }

    .role.active {
      border-color: #20a83a;
      color: white;
      background: #142116;
    }

    .role input {
      display: none;
    }

    .terms {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      color: #888;
      font-size: 13px;
      align-items: flex-start;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    .submit {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #20a83a;
      color: white;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .5;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .error {
      background: #321515;
      color: #ff8b8b;
    }

    .success {
      background: #12351b;
      color: #79df91;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #888;
    }

    .login-link a {
      color: #20a83a;
      text-decoration: none;
      font-weight: 700;
    }

  </style>

</head>

<body>

  <header>

    <div class="logo">
      SHIT<span>.</span>BLEJ
    </div>

    <button
      class="back"
      onclick="location.href='index.html'">
      ← Kthehu
    </button>

  </header>


  <main class="container">

    <div class="card">

      <h1>Regjistrohu</h1>

      <p class="subtitle">
        Krijo llogarinë tënde në SHIT.BLEJ.
      </p>


      <form id="registerForm">

        <label>
          Emri
        </label>

        <input
          id="name"
          type="text"
          placeholder="Emri dhe mbiemri"
          required>


        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="email@example.com"
          required>


        <label>
          Telefoni
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="+355 6x xxx xxxx">


        <label>
          Zgjidh llogarinë
        </label>

        <div class="roles">

          <label
            class="role active"
            id="customerRole">

            <input
              type="radio"
              name="role"
              value="customer"
              checked>

            Blerës

          </label>


          <label
            class="role"
            id="sellerRole">

            <input
              type="radio"
              name="role"
              value="seller">

            Shitës

          </label>

        </div>


        <label>
          Fjalëkalimi
        </label>

        <input
          id="password"
          type="password"
          placeholder="Minimumi 6 karaktere"
          minlength="6"
          required>


        <label>
          Konfirmo fjalëkalimin
        </label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="Përsërite fjalëkalimin"
          required>


        <label class="terms">

          <input
            id="terms"
            type="checkbox"
            required>

          <span>
            Pranoj kushtet e përdorimit të SHIT.BLEJ.
          </span>

        </label>


        <div
          id="message"
          class="message">
        </div>


        <button
          id="submitButton"
          class="submit"
          type="submit">

          Krijo llogarinë

        </button>

      </form>


      <div class="login-link">

        Ke tashmë llogari?

        <a href="login.html">
          Hyr këtu
        </a>

      </div>

    </div>

  </main>


  <script>

    const API = "/api";


    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");


    const customerRole =
      document.getElementById("customerRole");

    const sellerRole =
      document.getElementById("sellerRole");


    customerRole.onclick = () => {

      customerRole.classList.add("active");
      sellerRole.classList.remove("active");

      customerRole.querySelector("input").checked = true;

    };


    sellerRole.onclick = () => {

      sellerRole.classList.add("active");
      customerRole.classList.remove("active");

      sellerRole.querySelector("input").checked = true;

    };


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name")
            .value
            .trim();

        const email =
          document.getElementById("email")
            .value
            .trim();

        const phone =
          document.getElementById("phone")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;

        const confirmPassword =
          document.getElementById("confirmPassword")
            .value;

        const role =
          document.querySelector(
            'input[name="role"]:checked'
          ).value;


        if (password.length < 6) {

          showMessage(
            "Fjalëkalimi duhet të ketë të paktën 6 karaktere.",
            "error"
          );

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "Fjalëkalimet nuk përputhen.",
            "error"
          );

          return;

        }


        submitButton.disabled = true;

        submitButton.textContent =
          "Duke krijuar...";


        try {

          const response =
            await fetch(
              API + "/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  name,
                  email,
                  identifier: email,
                  phone,
                  password,
                  role
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok || !data.success) {

            throw new Error(
              data.error ||
              "Regjistrimi dështoi."
            );

          }


          showMessage(
            "Llogaria u krijua me sukses! Po të çojmë te hyrja...",
            "success"
          );


          setTimeout(() => {

            location.href =
              "login.html?registered=1";

          }, 1500);


        } catch (error) {

          showMessage(
            error.message,
            "error"
          );

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Krijo llogarinë";

        }

      }
    );

  </script>

</body>

</html>

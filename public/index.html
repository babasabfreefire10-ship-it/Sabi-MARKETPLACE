
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<title>SHIT.BLEJ | Marketplace</title>
<meta name="description" content="Blej, shit dhe gjej produkte në Shqipëri.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --text:#1c1e21;
  --muted:#65676b;
  --white:#fff;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 3px #0001}
.top{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-size:23px;font-weight:900;color:var(--blue);text-decoration:none;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:25px;padding:0 14px;flex:1;max-width:650px}
.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:12px 0}
.search button{border:0;background:transparent;font-size:18px}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}
.login{background:var(--bg);color:var(--text)}
.sell{background:var(--blue);color:#fff}
.profile{display:none;background:#e7f0ff;color:var(--blue);border:0;border-radius:50%;width:43px;height:43px;align-items:center;justify-content:center;font-size:23px}
main{max-width:1200px;margin:auto;padding:18px 16px 90px}
.intro{background:#fff;padding:20px;border-radius:14px;margin-bottom:18px}
.intro h1{font-size:25px;margin-bottom:7px}
.intro p{color:var(--muted);font-size:14px;line-height:1.5}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-head h2{font-size:20px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.category{white-space:nowrap;border:0;border-radius:22px;padding:10px 15px;background:#fff;color:var(--text);font-weight:700}
.category.active{background:var(--blue);color:#fff}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e4e6eb;cursor:pointer;min-width:0;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 12px #0002}
.image-box{height:210px;background:#e4e6eb;position:relative}
.image-box img{width:100%;height:100%;object-fit:cover;display:block}
.no-image{height:100%;display:flex;align-items:center;justify-content:center;color:#65676b;font-size:14px}
.badge{position:absolute;top:9px;left:9px;background:#ffdf6e;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:800}
.card-body{padding:12px}
.card-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:7px;overflow-wrap:anywhere}
.price{font-size:18px;font-weight:800;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px}
.loading,.empty,.error{grid-column:1/-1;background:#fff;text-align:center;padding:35px 18px;border-radius:12px;line-height:1.6}
.retry{background:var(--blue);color:#fff;border:0;padding:10px 16px;border-radius:8px;margin-top:12px}
footer{text-align:center;background:#fff;padding:22px 12px;color:var(--muted);font-size:13px}
footer strong{color:var(--blue)}
.bottom{display:none}
@media(max-width:900px){
  .products{grid-template-columns:repeat(3,minmax(0,1fr))}
  .image-box{height:190px}
}
@media(max-width:600px){
  .top{padding:10px 12px;gap:8px;flex-wrap:wrap}
  .logo{font-size:20px}
  .search{order:3;flex-basis:100%;max-width:none}
  .actions{gap:6px}
  .btn{padding:10px 11px;font-size:13px}
  main{padding:12px 10px 90px}
  .intro{padding:16px;margin-bottom:12px}
  .intro h1{font-size:22px}
  .section-head{margin:16px 0 10px}
  .section-head h2{font-size:18px}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .image-box{height:auto;aspect-ratio:1/1}
  .card-body{padding:10px}
  .card-title{font-size:14px}
  .price{font-size:16px}
  .meta{font-size:11px}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:30}
  .bottom button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
  .bottom .symbol{font-size:20px}
  .bottom .active{color:var(--blue)}
}
@media(max-width:350px){
  .logo{font-size:18px}
  .btn{padding:9px 8px}
  .products{gap:7px}
}
</style>
</head>

<body>
<header>
  <div class="top">
    <a class="logo" href="/">SHIT.BLEJ</a>

    <div class="search">
      <input id="topSearch" type="search" placeholder="Kërko produkte..." autocomplete="off">
      <button id="searchBtn" aria-label="Kërko">🔎</button>
    </div>

    <div class="actions">
      <button id="loginBtn" class="btn login">Hyr</button>
      <button id="sellBtn" class="btn sell">＋ Shit</button>
      <button id="profileBtn" class="profile" aria-label="Llogaria ime" title="Llogaria ime">👤</button>
    </div>
  </div>
</header>

<main>
  <section class="intro">
    <h1>Gjej çfarë të duhet.</h1>
    <p>Bli, shit dhe kontakto shitësit lehtësisht në Shqipëri.</p>
  </section>

  <div class="section-head">
    <h2>Kategoritë</h2>
  </div>

  <div class="categories" id="categories">
    <button class="category active" data-category="">Të gjitha</button>
    <button class="category" data-category="Elektronikë">📱 Elektronikë</button>
    <button class="category" data-category="Telefona">📲 Telefona</button>
    <button class="category" data-category="Makina">🚗 Makina</button>
    <button class="category" data-category="Moda">👕 Moda</button>
    <button class="category" data-category="Shtëpi">🏠 Shtëpi</button>
    <button class="category" data-category="Punë">💼 Punë</button>
    <button class="category" data-category="Shërbime">🛠️ Shërbime</button>
    <button class="category" data-category="Aksesorë">🎧 Aksesorë</button>
  </div>

  <div class="section-head">
    <h2 id="productHeading">Produktet e fundit</h2>
  </div>

  <div id="products" class="products">
    <div class="loading">Duke ngarkuar produktet...</div>
  </div>
</main>

<footer>
  <strong>SHIT.BLEJ</strong>
  <p style="margin-top:6px">Blej. Shit. Gjej.</p>
</footer>

<nav class="bottom">
  <button class="active" id="homeBtn">
    <span class="symbol">⌂</span>Kryefaqja
  </button>
  <button id="bottomSearchBtn">
    <span class="symbol">⌕</span>Kërko
  </button>
  <button id="bottomSellBtn">
    <span class="symbol">＋</span>Shit
  </button>
  <button id="bottomAccountBtn" style="display:none">
    <span class="symbol">👤</span>Llogaria
  </button>
  <button id="bottomLoginBtn">
    <span class="symbol">♙</span>Hyr
  </button>
</nav>

<script>
const API="/api";

let currentCategory="";
let currentSearch="";
let requestNumber=0;
let isLoggedIn=false;
let currentUser=null;

const $=id=>document.getElementById(id);

function getToken(){
  return localStorage.getItem("shitblej_token")||
         localStorage.getItem("sabiAuthToken");
}

function login(){
  location.href="/login.html";
}

function openAccount(){
  if(isLoggedIn){
    location.href="/account.html";
  }else{
    login();
  }
}

function sell(){
  if(!isLoggedIn){
    location.href="/login.html?next=%2Fseller.html";
    return;
  }

  const role=String(currentUser?.role||"").toLowerCase();

  if(["seller","admin","owner"].includes(role)){
    location.href="/seller.html";
  }else{
    location.href="/account.html";
  }
}

function showLoggedOut(){
  isLoggedIn=false;
  currentUser=null;

  $("loginBtn").style.display="inline-block";
  $("bottomLoginBtn").style.display="flex";
  $("profileBtn").style.display="none";
  $("bottomAccountBtn").style.display="none";
}

function showLoggedIn(user){
  isLoggedIn=true;
  currentUser=user;

  $("loginBtn").style.display="none";
  $("bottomLoginBtn").style.display="none";
  $("profileBtn").style.display="inline-flex";
  $("bottomAccountBtn").style.display="flex";
}

async function checkSession(){
  if(!getToken()){
    showLoggedOut();
    return;
  }

  try{
    const data=await api("/auth/me");
    const user=data.user||data.account||data.data?.user;

    if(!user||user.id==null){
      throw new Error("Sesioni nuk është i vlefshëm");
    }

    showLoggedIn(user);
  }catch(error){
    showLoggedOut();

    [
      "shitblej_token",
      "sabiAuthToken",
      "shitblej_user",
      "sabiUserId",
      "sabiUserName",
      "sabiUserRole",
      "sabiUserEmail",
      "sabiUserPhone"
    ].forEach(key=>localStorage.removeItem(key));
  }
}

async function api(path,options={}){
  const token=getToken();
  const headers={
    ...(options.body?{"Content-Type":"application/json"}:{}),
    ...(options.headers||{})
  };

  if(token){
    headers.Authorization="Bearer "+token;
  }

  const response=await fetch(API+path,{
    ...options,
    headers
  });

  const text=await response.text();
  let data={};

  try{
    data=text?JSON.parse(text):{};
  }catch{
    data={success:false,message:text};
  }

  if(!response.ok){
    throw new Error(data.message||data.error||"Gabim nga serveri");
  }

  return data;
}

function normalizeProducts(data){
  if(Array.isArray(data))return data;
  if(Array.isArray(data.products))return data.products;
  if(Array.isArray(data.results))return data.results;
  if(Array.isArray(data.data))return data.data;
  return [];
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatPrice(value){
  const number=Number(value||0);
  return new Intl.NumberFormat("sq-AL",{
    maximumFractionDigits:0
  }).format(number)+" ALL";
}

async function loadProducts(){
  const container=$("products");
  const thisRequest=++requestNumber;

  container.innerHTML='<div class="loading">Duke ngarkuar produktet...</div>';

  try{
    let data;

    if(currentSearch.trim()){
      data=await api("/products/search?q="+encodeURIComponent(currentSearch.trim()));
    }else{
      data=await api("/products");
    }

    if(thisRequest!==requestNumber)return;

    let products=normalizeProducts(data);

    if(currentCategory){
      products=products.filter(product=>{
        const category=String(
          product.category||product.category_name||""
        ).trim().toLocaleLowerCase("sq");

        return category===currentCategory.toLocaleLowerCase("sq");
      });
    }

    renderProducts(products);
  }catch(error){
    if(thisRequest!==requestNumber)return;

    console.error("Gabim në ngarkimin e produkteve:",error);

    container.innerHTML=`
      <div class="error">
        <h3>Nuk u ngarkuan produktet</h3>
        <p>${escapeHtml(error.message)}</p>
        <button class="retry" id="retryBtn">Provo përsëri</button>
      </div>`;

    $("retryBtn").addEventListener("click",loadProducts);
  }
}

function renderProducts(products){
  const container=$("products");

  if(!products.length){
    container.innerHTML=`
      <div class="empty">
        <h3>Nuk u gjetën produkte</h3>
        <p>Provo një kërkim tjetër ose zgjidh një kategori tjetër.</p>
      </div>`;
    return;
  }

  container.innerHTML=products.map(product=>{
    const id=Number(product.id);
    const title=product.title||product.name||"Produkt";
    const price=product.price||0;
    const image=product.image_url||product.image||"";
    const city=product.city||product.location||"Shqipëri";
    const category=product.category||"";
    const promoted=!!(
      product.promoted||
      product.is_promoted||
      product.promotion_active
    );

    return `
      <article class="card" role="link" tabindex="0"
        data-id="${Number.isFinite(id)?id:0}">
        <div class="image-box">
          ${image
            ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(title)}" loading="lazy">
               <div class="no-image" style="display:none">📷 Pa foto</div>`
            : '<div class="no-image">📷 Pa foto</div>'}
          ${promoted?'<span class="badge">⭐ I promovuar</span>':""}
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(title)}</div>
          <div class="price">${formatPrice(price)}</div>
          <div class="meta">
            <span>📍 ${escapeHtml(city)}</span>
            ${category?`<span>${escapeHtml(category)}</span>`:""}
          </div>
        </div>
      </article>`;
  }).join("");

  container.querySelectorAll(".card").forEach(card=>{
    const open=()=>openProduct(Number(card.dataset.id));

    card.addEventListener("click",open);
    card.addEventListener("keydown",event=>{
      if(event.key==="Enter"||event.key===" "){
        event.preventDefault();
        open();
      }
    });

    const img=card.querySelector("img");
    if(img){
      img.addEventListener("error",()=>{
        img.remove();
        const placeholder=card.querySelector(".no-image");
        if(placeholder)placeholder.style.display="flex";
      });
    }
  });
}

function searchProducts(){
  currentSearch=$("topSearch").value.trim();

  $("productHeading").textContent=currentSearch
    ?"Rezultatet e kërkimit"
    :"Produktet e fundit";

  loadProducts();
  document.querySelector("main").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

function filterCategory(category){
  currentCategory=category;

  document.querySelectorAll(".category").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.category===category
    );
  });

  loadProducts();
}

function openProduct(id){
  if(!id)return;
  location.href="/products.html?id="+encodeURIComponent(id);
}

function focusSearch(){
  $("topSearch").focus();
  window.scrollTo({top:0,behavior:"smooth"});
}

$("loginBtn").addEventListener("click",login);
$("bottomLoginBtn").addEventListener("click",login);
$("profileBtn").addEventListener("click",openAccount);
$("bottomAccountBtn").addEventListener("click",openAccount);
$("sellBtn").addEventListener("click",sell);
$("bottomSellBtn").addEventListener("click",sell);
$("homeBtn").addEventListener("click",()=>location.href="/");
$("searchBtn").addEventListener("click",searchProducts);
$("bottomSearchBtn").addEventListener("click",focusSearch);

$("topSearch").addEventListener("keydown",event=>{
  if(event.key==="Enter")searchProducts();
});

document.querySelectorAll(".category").forEach(button=>{
  button.addEventListener("click",()=>{
    filterCategory(button.dataset.category||"");
  });
});

loadProducts();
checkSession();
</script>
</body>
</html>

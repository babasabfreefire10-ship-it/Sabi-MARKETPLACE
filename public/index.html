<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHIT.BLEJ PRO</title>
  <meta name="description" content="SHIT.BLEJ PRO - Blej, shit dhe gjej gjithçka në Shqipëri.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      min-height: 68px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: #00e676;
      text-decoration: none;
      white-space: nowrap;
    }

    .search {
      flex: 1;
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      max-width: 650px;
    }

    .search input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 14px;
      font-size: 15px;
    }

    .search button {
      border: 0;
      background: #00e676;
      padding: 0 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      border: 1px solid #444;
      background: transparent;
      color: white;
      padding: 10px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .sell-btn {
      background: #00e676;
      color: #111;
      border: 0;
    }

    .hero {
      background: #111;
      color: white;
      padding: 55px 18px 70px;
    }

    .hero-inner {
      max-width: 1200px;
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(36px, 7vw, 70px);
      line-height: 1;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #00e676;
    }

    .hero p {
      color: #bbb;
      font-size: 18px;
      margin-bottom: 28px;
    }

    .hero-search {
      max-width: 850px;
      display: flex;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .hero-search input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 17px;
      font-size: 16px;
    }

    .hero-search button {
      border: 0;
      background: #00e676;
      padding: 0 25px;
      font-weight: 900;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 18px 80px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 25px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 35px;
    }

    .category {
      background: white;
      border: 1px solid #ddd;
      padding: 12px 16px;
      border-radius: 30px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 700;
    }

    .category:hover,
    .category.active {
      background: #00e676;
      border-color: #00e676;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #e2e2e2;
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
    }

    .image-box {
      position: relative;
      height: 210px;
      background: #eee;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-weight: 700;
    }

    .badge {
      position: absolute;
      left: 10px;
      top: 10px;
      background: #00e676;
      color: #111;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 900;
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .meta {
      color: #777;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
      grid-column: 1 / -1;
    }

    footer {
      background: #111;
      color: #aaa;
      padding: 35px 18px;
      text-align: center;
    }

    footer strong {
      color: #00e676;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }

      .nav {
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .search {
        order: 3;
        width: 100%;
        max-width: none;
      }
    }

    @media (max-width: 650px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .image-box {
        height: 170px;
      }

      .hero {
        padding: 40px 15px 50px;
      }

      .hero p {
        font-size: 15px;
      }

      .nav-actions .nav-btn:first-child {
        display: none;
      }

      .logo {
        font-size: 20px;
      }
    }

    @media (max-width: 380px) {
      .products {
        grid-template-columns: 1fr;
      }

      .image-box {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <a class="logo" href="/">SHIT.BLEJ</a>

    <div class="search">
      <input
        id="topSearch"
        type="text"
        placeholder="Kërko produkte..."
        autocomplete="off"
      >
      <button onclick="searchProducts()">Kërko</button>
    </div>

    <div class="nav-actions">
      <button class="nav-btn" onclick="login()">Hyr</button>
      <button class="nav-btn sell-btn" onclick="sell()">+ Shit</button>
    </div>

  </div>
</header>

<section class="hero">

  <div class="hero-inner">

    <h1>Blej. <span>Shit.</span> Gjej.</h1>

    <p>
      Marketplace-i yt për produkte të reja dhe të përdorura në Shqipëri.
    </p>

    <div class="hero-search">
      <input
        id="heroSearch"
        type="text"
        placeholder="Çfarë po kërkon?"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') searchProducts()"
      >

      <button onclick="searchProducts()">
        Kërko
      </button>
    </div>

  </div>

</section>

<main>

  <div class="section-title">
    <h2>Kategoritë</h2>
  </div>

  <div class="categories" id="categories">

    <button class="category active" onclick="filterCategory('')">
      Të gjitha
    </button>

    <button class="category" onclick="filterCategory('Elektronikë')">
      Elektronikë
    </button>

    <button class="category" onclick="filterCategory('Telefona')">
      Telefona
    </button>

    <button class="category" onclick="filterCategory('Makina')">
      Makina
    </button>

    <button class="category" onclick="filterCategory('Moda')">
      Moda
    </button>

    <button class="category" onclick="filterCategory('Shtëpi')">
      Shtëpi
    </button>

    <button class="category" onclick="filterCategory('Punë')">
      Punë
    </button>

    <button class="category" onclick="filterCategory('Shërbime')">
      Shërbime
    </button>

    <button class="category" onclick="filterCategory('Aksesorë')">
      Aksesorë
    </button>

  </div>

  <div class="section-title">
    <h2>Produktet</h2>
  </div>

  <div id="products" class="products">

    <div class="loading">
      Duke ngarkuar produktet...
    </div>

  </div>

</main>

<footer>
  <strong>SHIT.BLEJ PRO</strong>
  <br><br>
  Blej. Shit. Gjej.
</footer>

<script>

const API = "/api";

let currentCategory = "";
let currentSearch = "";


/* =========================
   HELPERS
========================= */

function login() {
  window.location.href = "/login.html";
}

function sell() {
  window.location.href = "/login.html?next=%2Fseller.html";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatPrice(value) {

  const number = Number(value || 0);

  return new Intl.NumberFormat("sq-AL", {
    maximumFractionDigits: 0
  }).format(number) + " ALL";
}


/* =========================
   API
========================= */

async function api(path, options = {}) {

  const token =
    localStorage.getItem("shitblej_token") ||
    localStorage.getItem("sabiAuthToken");

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  if (token) {
    headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(API + path, {
    ...options,
    headers
  });

  const text = await response.text();

  let data;

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    data = {
      success: false,
      message: text
    };
  }

  if (!response.ok) {
    throw new Error(
      data.message ||
      data.error ||
      "Gabim nga serveri"
    );
  }

  return data;
}


/* =========================
   PRODUCT NORMALIZER
========================= */

function normalizeProducts(data) {

  if (Array.isArray(data)) {
    return data;
  }

  if (Array.isArray(data.products)) {
    return data.products;
  }

  if (Array.isArray(data.results)) {
    return data.results;
  }

  if (Array.isArray(data.data)) {
    return data.data;
  }

  return [];
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const container =
    document.getElementById("products");

  container.innerHTML = `
    <div class="loading">
      Duke ngarkuar produktet...
    </div>
  `;

  try {

    let data;

    if (currentSearch.trim()) {

      data = await api(
        "/products/search?q=" +
        encodeURIComponent(currentSearch.trim())
      );

    } else {

      data = await api("/products");

    }

    let products = normalizeProducts(data);

    if (currentCategory) {

      products = products.filter(product => {

        const category =
          product.category ||
          product.category_name ||
          "";

        return category.toLowerCase() ===
          currentCategory.toLowerCase();

      });

    }

    renderProducts(products);

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="error">
        <h3>Nuk u ngarkuan produktet</h3>
        <br>
        <p>${escapeHtml(error.message)}</p>
        <br>
        <button onclick="loadProducts()">
          Provo përsëri
        </button>
      </div>
    `;

  }

}


/* =========================
   RENDER
========================= */

function renderProducts(products) {

  const container =
    document.getElementById("products");

  if (!products.length) {

    container.innerHTML = `
      <div class="empty">
        <h3>Nuk u gjetën produkte</h3>
        <br>
        <p>Provo një kërkim tjetër.</p>
      </div>
    `;

    return;
  }

  container.innerHTML =
    products.map(product => {

      const id = product.id;

      const title =
        product.title ||
        product.name ||
        "Produkt";

      const price =
        product.price || 0;

      const image =
        product.image_url ||
        product.image ||
        "";

      const city =
        product.city ||
        product.location ||
        "Shqipëri";

      const category =
        product.category ||
        "";

      const promoted =
        product.promoted ||
        product.is_promoted ||
        product.promotion_active ||
        false;

      return `

        <article
          class="card"
          onclick="openProduct(${Number(id)})"
        >

          <div class="image-box">

            ${
              image
              ?
              `<img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(title)}"
                loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
              >`
              :
              ""
            }

            <div
              class="no-image"
              style="${image ? "display:none" : ""}"
            >
              Pa foto
            </div>

            ${
              promoted
              ?
              `<div class="badge">⭐ PROMOTED</div>`
              :
              ""
            }

          </div>

          <div class="card-body">

            <div class="card-title">
              ${escapeHtml(title)}
            </div>

            <div class="price">
              ${formatPrice(price)}
            </div>

            <div class="meta">

              <span>
                📍 ${escapeHtml(city)}
              </span>

              <span>
                ${escapeHtml(category)}
              </span>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

function searchProducts() {

  const top =
    document.getElementById("topSearch").value.trim();

  const hero =
    document.getElementById("heroSearch").value.trim();

  currentSearch = top || hero;

  loadProducts();

  window.scrollTo({
    top: document.querySelector("main").offsetTop - 20,
    behavior: "smooth"
  });

}


/* =========================
   CATEGORY
========================= */

function filterCategory(category) {

  currentCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.classList.remove("active");

      if (
        category === "" &&
        button.textContent.trim() === "Të gjitha"
      ) {
        button.classList.add("active");
      }

      if (
        category &&
        button.textContent.trim() === category
      ) {
        button.classList.add("active");
      }

    });

  loadProducts();

}


/* =========================
   PRODUCT PAGE
========================= */

function openProduct(id) {

  if (!id) return;

  window.location.href =
    "/products.html?id=" +
    encodeURIComponent(id);

}


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>

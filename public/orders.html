<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Porositë — SHIT.BLEJ PRO</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:#070b09;
      color:#fff;
      min-height:100vh;
    }

    header{
      height:64px;
      background:#0b100d;
      border-bottom:1px solid #1b2821;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      position:sticky;
      top:0;
      z-index:20;
    }

    .logo{
      color:#fff;
      text-decoration:none;
      font-size:25px;
      font-weight:900;
    }

    .logo span{
      color:#00ff88;
    }

    nav{
      display:flex;
      gap:7px;
    }

    nav a{
      color:#cbd4ce;
      text-decoration:none;
      padding:9px 11px;
      border-radius:9px;
      font-size:13px;
      font-weight:700;
    }

    nav a:hover{
      background:#142019;
      color:#00ff88;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:25px 15px 60px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:22px;
    }

    h1{
      font-size:28px;
    }

    .subtitle{
      color:#7f8c84;
      font-size:13px;
      margin-top:5px;
    }

    .user-badge{
      background:#0d1711;
      border:1px solid #1c3024;
      color:#00ff88;
      padding:9px 12px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-bottom:20px;
    }

    .stat{
      background:#0d1310;
      border:1px solid #1b2821;
      border-radius:14px;
      padding:16px;
    }

    .stat-label{
      color:#718077;
      font-size:11px;
      margin-bottom:7px;
    }

    .stat-value{
      font-size:22px;
      font-weight:900;
    }

    .filters{
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:7px;
      margin-bottom:17px;
    }

    .filter{
      flex-shrink:0;
      border:1px solid #26342c;
      background:#0d1310;
      color:#aeb9b2;
      padding:9px 13px;
      border-radius:10px;
      cursor:pointer;
      font-size:12px;
      font-weight:800;
    }

    .filter.active{
      background:#00ff88;
      color:#001a0d;
      border-color:#00ff88;
    }

    .orders{
      display:grid;
      gap:12px;
    }

    .order{
      background:#0d1310;
      border:1px solid #1c2921;
      border-radius:16px;
      padding:17px;
    }

    .order-head{
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:flex-start;
      margin-bottom:14px;
    }

    .order-code{
      color:#00ff88;
      font-size:13px;
      font-weight:900;
    }

    .date{
      color:#66736b;
      font-size:11px;
      margin-top:5px;
    }

    .status{
      padding:7px 10px;
      border-radius:8px;
      font-size:10px;
      font-weight:900;
      white-space:nowrap;
    }

    .pending{
      color:#ffd76a;
      background:#30280e;
    }

    .confirmed{
      color:#6ac7ff;
      background:#0d2635;
    }

    .shipped{
      color:#c18cff;
      background:#211232;
    }

    .delivered{
      color:#00ff88;
      background:#0c2b1d;
    }

    .cancelled{
      color:#ff8888;
      background:#321515;
    }

    .order-body{
      display:grid;
      grid-template-columns:1fr auto;
      gap:15px;
    }

    .product-name{
      font-size:17px;
      font-weight:900;
      margin-bottom:6px;
    }

    .details{
      color:#8b9790;
      font-size:12px;
      line-height:1.7;
    }

    .details strong{
      color:#cbd4ce;
    }

    .total{
      text-align:right;
    }

    .total-label{
      color:#6e7b73;
      font-size:11px;
      margin-bottom:4px;
    }

    .total-value{
      color:#00ff88;
      font-size:20px;
      font-weight:900;
    }

    .customer-box{
      background:#090e0b;
      border:1px solid #19251f;
      border-radius:10px;
      padding:12px;
      margin-top:13px;
      font-size:12px;
      line-height:1.7;
    }

    .customer-title{
      color:#00ff88;
      font-weight:900;
      margin-bottom:4px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:14px;
      padding-top:13px;
      border-top:1px solid #19251f;
    }

    .actions button,
    .actions a{
      border:1px solid #29372f;
      background:#131b17;
      color:#fff;
      padding:9px 11px;
      border-radius:8px;
      text-decoration:none;
      cursor:pointer;
      font-size:11px;
      font-weight:800;
    }

    .actions button:hover,
    .actions a:hover{
      border-color:#00ff88;
      color:#00ff88;
    }

    .actions .cancel-btn{
      color:#ff8888;
    }

    .actions select{
      background:#080d0a;
      border:1px solid #29372f;
      color:#fff;
      border-radius:8px;
      padding:8px;
      font-size:11px;
    }

    .empty{
      text-align:center;
      padding:65px 20px;
      background:#0d1310;
      border:1px solid #1b2821;
      border-radius:16px;
    }

    .empty-icon{
      font-size:45px;
      margin-bottom:12px;
    }

    .empty h2{
      margin-bottom:7px;
    }

    .empty p{
      color:#77847c;
      font-size:13px;
      margin-bottom:18px;
    }

    .empty a{
      display:inline-block;
      background:#00ff88;
      color:#001a0d;
      padding:12px 17px;
      border-radius:10px;
      text-decoration:none;
      font-weight:900;
      font-size:13px;
    }

    .loading,
    .error{
      text-align:center;
      padding:60px 20px;
      color:#89968e;
    }

    .error{
      color:#ff8d8d;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%) translateY(100px);
      background:#00ff88;
      color:#001a0d;
      padding:12px 17px;
      border-radius:10px;
      font-size:13px;
      font-weight:900;
      transition:.25s;
      z-index:100;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:700px){

      header{
        padding:0 11px;
      }

      nav a{
        font-size:11px;
        padding:8px 7px;
      }

      .stats{
        grid-template-columns:1fr 1fr;
      }

      .top{
        align-items:flex-start;
        flex-direction:column;
      }

      .order-body{
        grid-template-columns:1fr;
      }

      .total{
        text-align:left;
      }
    }

    @media(max-width:430px){

      h1{
        font-size:24px;
      }

      .stat{
        padding:13px;
      }

      .stat-value{
        font-size:19px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="/" class="logo">
    SHIT<span>.</span>BLEJ
  </a>

  <nav>
    <a href="/">Kryefaqja</a>
    <a href="/seller.html">Shit</a>
    <a href="/admin.html">Admin</a>
  </nav>

</header>


<main class="container">

  <div class="top">

    <div>
      <h1>Porositë</h1>

      <div class="subtitle" id="subtitle">
        Menaxho porositë e tua
      </div>
    </div>

    <div class="user-badge" id="userBadge">
      Po kontrollohet...
    </div>

  </div>


  <div id="loading" class="loading">
    Po ngarkohen porositë...
  </div>

  <div id="error" class="error" style="display:none;"></div>


  <div id="content" style="display:none;">

    <div class="stats">

      <div class="stat">
        <div class="stat-label">TË GJITHA</div>
        <div class="stat-value" id="allCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">NË PRITJE</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">DORËZUAR</div>
        <div class="stat-value" id="deliveredCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">VLERË</div>
        <div class="stat-value" id="valueCount">0</div>
      </div>

    </div>


    <div class="filters">

      <button class="filter active" data-filter="all">
        Të gjitha
      </button>

      <button class="filter" data-filter="pending">
        Në pritje
      </button>

      <button class="filter" data-filter="confirmed">
        Konfirmuar
      </button>

      <button class="filter" data-filter="shipped">
        Dërguar
      </button>

      <button class="filter" data-filter="delivered">
        Dorëzuar
      </button>

      <button class="filter" data-filter="cancelled">
        Anuluar
      </button>

    </div>


    <div id="orders" class="orders"></div>

  </div>

</main>


<div id="toast" class="toast"></div>


<script>

const API = "/api";

let orders = [];

let currentFilter = "all";

let currentUser = null;


function getToken(){

  return (
    localStorage.getItem("shitblej_token") ||
    localStorage.getItem("sabiAuthToken") ||
    ""
  );

}


function money(value){

  return Number(value || 0)
    .toLocaleString("sq-AL") + " ALL";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function statusText(status){

  const map = {

    pending:"Në pritje",

    confirmed:"Konfirmuar",

    shipped:"Dërguar",

    delivered:"Dorëzuar",

    cancelled:"Anuluar",

    canceled:"Anuluar"

  };

  return map[status] || status || "Në pritje";

}


function statusClass(status){

  if(status === "canceled"){
    status = "cancelled";
  }

  return status || "pending";

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  },2500);

}


async function apiFetch(url, options = {}){

  const token = getToken();

  const headers = {
    ...(options.headers || {})
  };


  if(token){

    headers.Authorization =
      "Bearer " + token;

  }


  if(
    options.body &&
    !headers["Content-Type"]
  ){

    headers["Content-Type"] =
      "application/json";

  }


  const response =
    await fetch(API + url,{
      ...options,
      headers
    });


  let data = {};

  try{
    data = await response.json();
  }catch(e){}


  if(!response.ok){

    throw new Error(
      data.message ||
      data.error ||
      "Kërkesa dështoi."
    );

  }


  return data;

}


async function checkAuth(){

  const token = getToken();

  if(!token){

    window.location.href =
      "/login.html?next=/orders.html";

    return false;

  }


  try{

    const data =
      await apiFetch("/auth/me");


    currentUser =
      data.user ||
      data.account ||
      data.data?.user ||
      data;


    if(!currentUser){

      throw new Error("Sesioni nuk është aktiv.");

    }


    document.getElementById("userBadge").textContent =
      currentUser.name ||
      currentUser.email ||
      "Përdorues";


    const role =
      String(currentUser.role || "").toLowerCase();


    if(
      role === "seller" ||
      role === "admin"
    ){

      document.getElementById("subtitle").textContent =
        role === "admin"
          ? "Menaxho të gjitha porositë"
          : "Menaxho porositë e produkteve të tua";

    }


    return true;


  }catch(error){

    console.error(error);

    localStorage.removeItem("shitblej_token");
    localStorage.removeItem("sabiAuthToken");

    window.location.href =
      "/login.html?next=/orders.html";

    return false;

  }

}


function normalizeOrders(data){

  if(Array.isArray(data)){
    return data;
  }

  if(Array.isArray(data.orders)){
    return data.orders;
  }

  if(Array.isArray(data.results)){
    return data.results;
  }

  if(Array.isArray(data.data)){
    return data.data;
  }

  if(Array.isArray(data.data?.orders)){
    return data.data.orders;
  }

  return [];

}


async function loadOrders(){

  try{

    const data =
      await apiFetch("/orders");

    orders =
      normalizeOrders(data);

    updateStats();

    renderOrders();


    document.getElementById("loading").style.display =
      "none";

    document.getElementById("content").style.display =
      "block";


  }catch(error){

    console.error(error);

    document.getElementById("loading").style.display =
      "none";

    const errorBox =
      document.getElementById("error");

    errorBox.textContent =
      error.message ||
      "Porositë nuk u ngarkuan.";

    errorBox.style.display =
      "block";

  }

}


function getTotal(order){

  if(order.total != null){
    return Number(order.total);
  }

  if(order.order_total != null){
    return Number(order.order_total);
  }

  const price =
    Number(
      order.price ||
      order.product_price ||
      0
    );

  const quantity =
    Number(
      order.quantity ||
      1
    );

  return price * quantity;

}


function updateStats(){

  const all =
    orders.length;

  const pending =
    orders.filter(
      o => String(o.status || "pending") === "pending"
    ).length;

  const delivered =
    orders.filter(
      o => String(o.status || "") === "delivered"
    ).length;

  const value =
    orders.reduce(
      (sum,o) => sum + getTotal(o),
      0
    );


  document.getElementById("allCount").textContent =
    all;

  document.getElementById("pendingCount").textContent =
    pending;

  document.getElementById("deliveredCount").textContent =
    delivered;

  document.getElementById("valueCount").textContent =
    money(value);

}


function isSellerOrAdmin(){

  const role =
    String(currentUser?.role || "").toLowerCase();

  return (
    role === "seller" ||
    role === "admin" ||
    role === "owner"
  );

}


function renderOrders(){

  const container =
    document.getElementById("orders");


  let filtered =
    orders;


  if(currentFilter !== "all"){

    filtered =
      orders.filter(order => {

        let status =
          String(
            order.status || "pending"
          ).toLowerCase();

        if(status === "canceled"){
          status = "cancelled";
        }

        return status === currentFilter;

      });

  }


  if(filtered.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">📦</div>

        <h2>Nuk ka porosi</h2>

        <p>
          Nuk u gjetën porosi në këtë kategori.
        </p>

        <a href="/">
          SHIKO PRODUKTET
        </a>

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered.map(renderOrder).join("");

}


function renderOrder(order){

  const status =
    String(
      order.status || "pending"
    ).toLowerCase();


  const code =
    order.code ||
    order.order_code ||
    ("SABI-" + order.id);


  const title =
    order.product_title ||
    order.product_name ||
    order.title ||
    order.name ||
    "Produkt";


  const quantity =
    Number(order.quantity || 1);


  const total =
    getTotal(order);


  const created =
    order.created_at ||
    order.createdAt ||
    "";


  const seller =
    order.seller_name ||
    order.sellerName ||
    order.seller ||
    "";


  const customer =
    order.customer_name ||
    order.customerName ||
    order.buyer_name ||
    "";


  const phone =
    order.customer_phone ||
    order.customerPhone ||
    order.phone ||
    "";


  const city =
    order.customer_city ||
    order.customerCity ||
    order.city ||
    "";


  const address =
    order.customer_address ||
    order.customerAddress ||
    order.address ||
    "";


  const image =
    order.product_image ||
    order.image_url ||
    order.image ||
    "";


  let imageHTML = "";

  if(image){

    imageHTML = `
      <div style="
        width:65px;
        height:65px;
        border-radius:10px;
        overflow:hidden;
        background:#080d0a;
        flex-shrink:0;
      ">
        <img
          src="${escapeHTML(image)}"
          style="width:100%;height:100%;object-fit:cover;"
        >
      </div>
    `;

  }


  let actions = "";


  if(isSellerOrAdmin()){

    actions += `

      <select
        onchange="changeStatus(${Number(order.id)},this.value)"
      >

        <option value="pending"
          ${status==="pending"?"selected":""}>
          Në pritje
        </option>

        <option value="confirmed"
          ${status==="confirmed"?"selected":""}>
          Konfirmuar
        </option>

        <option value="shipped"
          ${status==="shipped"?"selected":""}>
          Dërguar
        </option>

        <option value="delivered"
          ${status==="delivered"?"selected":""}>
          Dorëzuar
        </option>

        <option value="cancelled"
          ${status==="cancelled"?"selected":""}>
          Anuluar
        </option>

      </select>

    `;

  }


  if(phone){

    const cleanPhone =
      phone.replace(/\s+/g,"");


    actions += `

      <a href="tel:${escapeHTML(cleanPhone)}">
        📞 Telefon
      </a>

      <a
        href="https://wa.me/${cleanPhone.replace(/\D/g,"")}"
        target="_blank"
      >
        💬 WhatsApp
      </a>

    `;

  }


  if(
    !isSellerOrAdmin() &&
    (
      status === "pending" ||
      status === "confirmed"
    )
  ){

    actions += `

      <button
        class="cancel-btn"
        onclick="cancelOrder(${Number(order.id)})"
      >
        ✕ Anulo porosinë
      </button>

    `;

  }


  return `

    <div class="order">

      <div class="order-head">

        <div>

          <div class="order-code">
            ${escapeHTML(code)}
          </div>

          <div class="date">
            ${escapeHTML(created)}
          </div>

        </div>

        <div class="status ${statusClass(status)}">
          ${escapeHTML(statusText(status))}
        </div>

      </div>


      <div class="order-body">

        <div>

          <div style="
            display:flex;
            gap:12px;
            align-items:center;
          ">

            ${imageHTML}

            <div>

              <div class="product-name">
                ${escapeHTML(title)}
              </div>

              <div class="details">

                Sasia:
                <strong>${quantity}</strong>

                &nbsp;•&nbsp;

                Shitësi:
                <strong>${escapeHTML(seller || "—")}</strong>

              </div>

            </div>

          </div>


          ${
            isSellerOrAdmin()
            ? `

              <div class="customer-box">

                <div class="customer-title">
                  Të dhënat e blerësit
                </div>

                <div>
                  👤 ${escapeHTML(customer || "—")}
                </div>

                <div>
                  📞 ${escapeHTML(phone || "—")}
                </div>

                <div>
                  📍 ${escapeHTML(city || "—")}
                </div>

                <div>
                  🏠 ${escapeHTML(address || "—")}
                </div>

              </div>

            `
            : ""
          }


          <div class="actions">
            ${actions}
          </div>

        </div>


        <div class="total">

          <div class="total-label">
            TOTAL
          </div>

          <div class="total-value">
            ${money(total)}
          </div>

        </div>

      </div>

    </div>

  `;

}


async function changeStatus(id,status){

  if(!id) return;


  try{

    await apiFetch(
      "/orders/" + encodeURIComponent(id),
      {
        method:"PUT",

        body:JSON.stringify({
          status:status
        })
      }
    );


    showToast("Statusi u ndryshua.");

    await loadOrders();


  }catch(error){

    alert(
      error.message ||
      "Statusi nuk u ndryshua."
    );

  }

}


async function cancelOrder(id){

  if(!confirm("Je i sigurt që dëshiron ta anulosh porosinë?")){
    return;
  }


  try{

    await apiFetch(
      "/orders/" + encodeURIComponent(id),
      {
        method:"PUT",

        body:JSON.stringify({
          status:"cancelled"
        })
      }
    );


    showToast("Porosia u anulua.");

    await loadOrders();


  }catch(error){

    alert(
      error.message ||
      "Porosia nuk u anulua."
    );

  }

}


document.querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener("click",function(){

      document
        .querySelectorAll(".filter")
        .forEach(b =>
          b.classList.remove("active")
        );

      this.classList.add("active");

      currentFilter =
        this.dataset.filter;

      renderOrders();

    });

  });


(async function(){

  const authenticated =
    await checkAuth();

  if(!authenticated){
    return;
  }

  await loadOrders();

})();

</script>

</body>
</html>
